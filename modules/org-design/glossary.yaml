terms:
  - id: multinational-corporation
    term: Multinational corporation
    aka: [MNC, MNCs, multinational]
    short: A company that runs business operations in more than one country.
    related: [organizational-design]
    skills: [org-dimensions]
  - id: organizational-design
    term: Organizational design
    short: Deciding how a company should be organized so that its worldwide activities fit together efficiently and effectively.
    related: [formalization, hierarchy]
    skills: [org-dimensions]
  - id: formalization
    term: Formalization
    short: Using rules, policies, procedures and budgets to guide how people work.
    related: [standardization]
    skills: [org-dimensions]
  - id: standardization
    term: Standardization
    short: Using the same approach across the different units of a company.
    related: [formalization]
    skills: [org-dimensions]
  - id: span-of-control
    term: Span of control
    short: The number of employees a manager can effectively oversee.
    formula: '\text{managers needed} = \lceil \text{people} \div \text{span} \rceil'
    related: [hierarchy]
    skills: [org-dimensions]
  - id: hierarchy
    term: Hierarchy
    short: The arrangement of an organization into levels of authority and responsibility.
    related: [span-of-control]
    skills: [org-dimensions]
  - id: departmentalization
    term: Departmentalization
    short: Grouping people and activities into units by function, product, service, customer or place.
    related: [hierarchy]
    skills: [org-dimensions]
  - id: centralization
    term: Centralization
    short: Making decisions at the top level of the company, at headquarters.
    related: [decentralization]
    skills: [decision-allocation]
  - id: decentralization
    term: Decentralization
    short: Letting lower levels, such as subsidiaries, make decisions.
    related: [centralization]
    skills: [decision-allocation]
  - id: coordination-mechanisms
    term: Coordination mechanisms
    short: Ways of linking the activities of different units and levels of a company.
    related: [control-mechanisms]
    skills: [decision-allocation]
  - id: control-mechanisms
    term: Control mechanisms
    short: Ways of checking performance and results, such as formal, informal, output, process and social controls.
    related: [coordination-mechanisms]
    skills: [decision-allocation]
  - id: international-division
    term: International division
    short: A unit at the same level as the domestic division that is responsible for all activities outside the home country.
    related: [geographic-structure]
    skills: [structure-types]
  - id: product-structure
    term: International product structure
    aka: [product structure, worldwide product division]
    short: A structure where product divisions are responsible for their products' operations worldwide.
    related: [geographic-structure]
    skills: [structure-types]
  - id: geographic-structure
    term: Geographic region structure
    aka: [geographic structure, regional structure]
    short: A structure where area managers are responsible for all activities in their region and report to the CEO.
    related: [product-structure]
    skills: [structure-types]
  - id: functional-structure
    term: Global functional structure
    aka: [functional structure]
    short: A structure organized by function, such as production and sales, at the top level.
    related: [product-structure]
    skills: [structure-types]
  - id: hybrid-structure
    term: Hybrid organizational structure
    aka: [hybrid structure, hybrid organization]
    short: A structure that uses more than one organizing dimension at the top level.
    related: [matrix-organization]
    skills: [structure-types]
  - id: matrix-organization
    term: Matrix organization
    aka: [matrix]
    short: A structure that layers two or more dimensions, such as product and region, so some managers have two bosses.
    related: [matrix-overlay]
    skills: [structure-types]
  - id: matrix-overlay
    term: Matrix overlay
    short: A structure where top-level divisions must listen to a staff of experts from another dimension, avoiding double reporting.
    related: [matrix-organization]
    skills: [structure-types]
  - id: strategic-business-unit
    term: Strategic business unit
    aka: [SBU, SBUs]
    short: A self-contained business with its own market and competitors, small enough for one manager to control.
    related: [product-structure]
    skills: [structure-types]
  - id: reengineering
    term: Reengineering
    short: Redesigning structure, hierarchy, systems and processes to make an organization more efficient.
    related: [virtual-corporation]
    skills: [structure-types]
  - id: virtual-corporation
    term: Virtual corporation
    short: A company that delivers value to customers using resources outside its own boundaries, helped by remote work.
    related: [dynamic-network]
    skills: [structure-types]
  - id: horizontal-corporation
    term: Horizontal corporation
    short: A company organized around lateral decision-making and networks, with a strong shared philosophy.
    related: [dynamic-network]
    skills: [structure-types]
  - id: dynamic-network
    term: Dynamic network structure
    aka: [dynamic network]
    short: A structure that splits major functions into smaller, more agile companies coordinated by a small headquarters.
    related: [horizontal-corporation]
    skills: [structure-types]
  - id: home-replication-strategy
    term: Home replication strategy
    short: Transferring existing products and processes from the home country to other markets.
    related: [ethnocentric-culture]
    skills: [strategy-culture]
  - id: global-strategy
    term: Global strategy
    short: Offering standardized products and services around the world.
    related: [transnational-strategy]
    skills: [strategy-culture]
  - id: multidomestic-strategy
    term: Multidomestic strategy
    short: Adapting to local preferences, rules and cultures in each market.
    related: [polycentric-culture]
    skills: [strategy-culture]
  - id: transnational-strategy
    term: Transnational strategy
    short: Standardizing when possible and adapting when necessary.
    related: [geocentric-culture]
    skills: [strategy-culture]
  - id: ethnocentric-culture
    term: Ethnocentric culture
    short: A company culture that treats the home country's ways as the best and spreads them abroad.
    related: [home-replication-strategy]
    skills: [strategy-culture]
  - id: polycentric-culture
    term: Polycentric culture
    short: A company culture that lets each country follow its own local ways.
    related: [multidomestic-strategy]
    skills: [strategy-culture]
  - id: geocentric-culture
    term: Geocentric culture
    short: A company culture that takes the best practices from anywhere in the world.
    related: [transnational-strategy]
    skills: [strategy-culture]
  - id: pretax-profit
    term: Pretax profit
    short: Profit before income tax is taken out.
    related: [after-tax-profit]
    skills: [transfer-pricing]
  - id: after-tax-profit
    term: After-tax profit
    short: Profit that remains after income tax is paid.
    formula: '\text{after-tax profit} = \text{pretax profit} \times (1 - \text{tax rate})'
    related: [pretax-profit]
    skills: [transfer-pricing]
  - id: transfer-pricing
    term: Transfer pricing
    short: The prices set for goods and services sold between units of the same company, which also shift where profit shows up.
    related: [pretax-profit, after-tax-profit]
    skills: [transfer-pricing]
  - id: subsidiary
    term: Subsidiary
    aka: [subsidiaries]
    short: A company controlled by a parent that owns enough voting stock to elect a majority of its board.
    related: [affiliate]
    skills: [control-influence]
  - id: affiliate
    term: Affiliate
    aka: [affiliates]
    short: A company the parent controls without being a majority owner, through stock or other means.
    related: [subsidiary, joint-venture]
    skills: [control-influence]
  - id: joint-venture
    term: Joint venture
    aka: [joint ventures]
    short: A business that two or more companies own and run together.
    related: [affiliate]
    skills: [control-influence]
  - id: management-contract
    term: Management contract
    short: An agreement under which one company manages another, which can give control without owning the stock.
    related: [affiliate]
    skills: [control-influence]

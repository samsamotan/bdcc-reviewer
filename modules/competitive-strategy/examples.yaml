examples:
  - id: strategy-home
    source: 'M9, slide 23: home replication (inferred low and low)'
    fn: chooseStrategy
    in: { cost: low, adapt: low }
    expect: { strategy: Home replication }
  - id: strategy-multidomestic
    source: 'M9, slide 23: multidomestic when pressure to adapt is strong'
    fn: chooseStrategy
    in: { cost: low, adapt: high }
    expect: { strategy: Multidomestic }
  - id: strategy-global
    source: 'M9, slide 23: global when pressure for cost reduction is strong and pressure to adapt is limited'
    fn: chooseStrategy
    in: { cost: high, adapt: low }
    expect: { strategy: Global }
  - id: strategy-transnational
    source: 'M9, slide 23: transnational when both pressures are strong'
    fn: chooseStrategy
    in: { cost: high, adapt: high }
    expect: { strategy: Transnational }
  - id: value-created
    source: 'Beyond the slides: economic value creation (slide 10)'
    fn: valueCreation
    in: { willingness: 100, price: 70, unitCost: 50 }
    expect: { created: 50, surplus: 30, profit: 20, balanced: true }
    tol: 0.005
  - id: value-negative
    source: 'Beyond the slides: economic value creation (slide 10)'
    fn: valueCreation
    in: { willingness: 40, price: 35, unitCost: 50 }
    expect: { created: -10, surplus: 5, profit: -15 }
    tol: 0.005
  - id: average-cost-small
    source: 'Beyond the slides: economies of scale (slide 14)'
    fn: averageCost
    in: { fixedCost: 20000, variableCost: 5, units: 1000 }
    expect: { spread: 20, average: 25 }
    tol: 0.005
  - id: average-cost-large
    source: 'Beyond the slides: economies of scale (slide 14)'
    fn: averageCost
    in: { fixedCost: 20000, variableCost: 5, units: 10000 }
    expect: { spread: 2, average: 7 }
    tol: 0.005
  - id: learning-two
    source: 'Beyond the slides: learning and experience curve effects (slide 14)'
    fn: learningCurve
    in: { firstCost: 100, rate: 0.8, doublings: 2 }
    expect: { cost: 64, saving: 36 }
    tol: 0.005
  - id: learning-three
    source: 'Beyond the slides: learning and experience curve effects (slide 14)'
    fn: learningCurve
    in: { firstCost: 800, rate: 0.9, doublings: 3 }
    expect: { cost: 583.2 }
    tol: 0.005
  - id: budget-example
    source: 'Beyond the slides: sales forecast and budget (slide 30)'
    fn: budgetPlan
    in: { lastSales: 200000, growth: 0.1, costRatio: 0.5, fixedExpenses: 20000 }
    expect: { forecast: 220000, expenses: 130000, net: 90000 }
    tol: 0.5
  - id: common-actions
    source: 'Beyond the slides: scenario planning (slide 27)'
    fn: commonActions
    in: { scenarios: '@scenarios' }
    expect: { count: 2, total: 7, stories: 3 }
  - id: common-first
    source: 'Beyond the slides: scenario planning (slide 27)'
    fn: commonActions
    in: { scenarios: '@scenarios' }
    expect: { common.0: hire-local-managers, common.1: keep-cost-focus }

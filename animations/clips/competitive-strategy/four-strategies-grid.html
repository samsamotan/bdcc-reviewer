<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Four strategies on two pressures</title>
  <link rel="stylesheet" href="../../kit/kit.css">
  <script src="../../kit/vendor/gsap.min.js"></script>
  <script src="../../kit/kit.js"></script>
</head>
<body>
  <!-- Competitive Strategy · pick-a-strategy, beats 1–5 · 5 s. Segments: 0–0.6 the two axes, 0.6–1.4 home replication, 1.4–2.2 multidomestic, 2.2–2.8 a "?" in the high-cost, low-adapt cell (no name: beat 4 asks), 2.8–5.0 global, then transnational. -->
  <div id="stage" data-composition-id="four-strategies-grid" data-start="0" data-width="1280" data-height="720" data-duration="5"></div>
  <script>
    /*
     * Competitive Strategy · pick-a-strategy, 5 s. A 2×2: cost pressure up the side, pressure to adapt along the bottom.
     *   0.0–0.6  the axes and grid draw: "Cost pressure" low → high, "Pressure to adapt" low → high
     *   0.6–1.4  bottom-left lights teal: one product copied from home to abroad. "Home replication"
     *   1.4–2.2  bottom-right lights violet: three differently shaped products. "Multidomestic"
     *   2.2–2.8  top-left pulses with a "?" badge; no name
     *   2.8–3.8  top-left lights gold: the same product stamped round a globe. "Global"
     *   3.8–4.6  top-right lights coral: two-way arrows link a standard core and local variants. "Transnational"
     *   4.6–5.0  hold
     */
    (() => {
      const { C } = HF;
      const tl = HF.timeline(5);
      window.__timelines['four-strategies-grid'] = tl;
      const back = HF.layer('back');
      const mid = HF.layer('mid');
      const front = HF.layer('front');
      const GX = 470, GY = 120, CW = 300, CH = 240; // grid origin (top-left) and cell size
      const cell = (cx, cy) => ({ x: GX + cx * CW, y: GY + cy * CH }); // cx 0 = low adapt, cy 0 = high cost (top)

      // cells
      const CELLS = [
        { k: 'home', cx: 0, cy: 1, col: C.teal, name: 'Home replication' },
        { k: 'multi', cx: 1, cy: 1, col: C.violet, name: 'Multidomestic' },
        { k: 'global', cx: 0, cy: 0, col: C.gold, name: 'Global' },
        { k: 'trans', cx: 1, cy: 0, col: C.coral, name: 'Transnational' },
      ];
      const cells = {};
      CELLS.forEach(({ k, cx, cy, col, name }) => {
        const { x, y } = cell(cx, cy);
        const bg = HF.el('rect', { x: x + 8, y: y + 8, width: CW - 16, height: CH - 16, rx: 26, fill: '#1B2C5E' }, back);
        const glow = HF.el('rect', { x: x + 8, y: y + 8, width: CW - 16, height: CH - 16, rx: 26, fill: col, opacity: 0 }, back);
        const tag = HF.label(name, { x: x + CW / 2, y: y + CH - 36, cls: 'sm pill', html: false });
        tag.style.color = col;
        const icon = HF.g(mid, { transform: `translate(${x + CW / 2} ${y + CH / 2 - 22})` });
        const ic = HF.g(icon);
        gsap.set(ic, { scale: 0, transformOrigin: '50% 50%' });
        cells[k] = { bg, glow, tag, ic, x, y };
      });
      gsap.set(Object.values(cells).map((c) => c.bg), { opacity: 0 });

      // icons
      const prod = (p, x, y, col, shape = 'sq', s = 1) => {
        if (shape === 'sq') return HF.box(p, { x: x - 22 * s, y: y - 22 * s, w: 44 * s, h: 44 * s, r: 10 * s, color: col });
        if (shape === 'ci') return HF.el('circle', { cx: x, cy: y, r: 24 * s, fill: col }, p);
        return HF.el('path', { d: `M${x} ${y - 26 * s} L${x + 26 * s} ${y + 20 * s} L${x - 26 * s} ${y + 20 * s} Z`, fill: col }, p);
      };
      // home replication: home → copy abroad
      prod(cells.home.ic, -70, 0, C.teal);
      HF.el('path', { d: 'M-30 0 L22 0 M10 -12 L24 0 L10 12', fill: 'none', stroke: '#F4F1DE', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, cells.home.ic);
      prod(cells.home.ic, 70, 0, C.teal);
      // multidomestic: three different products
      prod(cells.multi.ic, -70, 0, C.violet, 'sq', 0.9);
      prod(cells.multi.ic, 0, 0, C.gold, 'ci', 0.9);
      prod(cells.multi.ic, 70, 0, C.coral, 'tr', 0.9);
      // global: globe with the same product around it
      HF.el('circle', { cx: 0, cy: 0, r: 52, fill: '#2E8B9A' }, cells.global.ic);
      HF.el('ellipse', { cx: 0, cy: 0, rx: 22, ry: 52, fill: 'none', stroke: '#7FD3D0', 'stroke-width': 4 }, cells.global.ic);
      HF.el('line', { x1: -52, y1: 0, x2: 52, y2: 0, stroke: '#7FD3D0', 'stroke-width': 4 }, cells.global.ic);
      [[-88, -10], [88, -10], [0, -70]].forEach(([x, y]) => prod(cells.global.ic, x, y, C.gold, 'sq', 0.7));
      // transnational: a core square with local variants and two-way arrows
      prod(cells.trans.ic, 0, 0, C.coral, 'sq', 1.1);
      [[-90, 0, 'ci'], [90, 0, 'tr']].forEach(([x, y, sh]) => {
        prod(cells.trans.ic, x, y, HF.light(C.coral, 0.2), sh, 0.75);
        const d = x < 0 ? 'M-62 -6 L-34 -6 M-62 6 L-34 6' : 'M34 -6 L62 -6 M34 6 L62 6';
        HF.el('path', { d, stroke: '#F4F1DE', 'stroke-width': 5, 'stroke-linecap': 'round' }, cells.trans.ic);
      });
      // the "?" badge
      const q = HF.g(front, { transform: `translate(${GX + CW / 2} ${GY + CH / 2 - 22})` });
      const qIn = HF.g(q);
      HF.el('circle', { cx: 0, cy: 0, r: 46, fill: C.gold, opacity: 0.25 }, qIn);
      HF.el('circle', { cx: 0, cy: 0, r: 34, fill: '#F4F1DE' }, qIn);
      HF.text(qIn, '?', { x: 0, y: 14, size: 44, color: '#0B1D3A', weight: 900 });
      gsap.set(qIn, { scale: 0, transformOrigin: '50% 50%' });

      // axes
      const axes = HF.g(front);
      const yAx = HF.el('line', { x1: GX - 30, y1: GY + 2 * CH, x2: GX - 30, y2: GY - 10, stroke: '#C9D3F2', 'stroke-width': 6, 'stroke-linecap': 'round' }, axes);
      const xAx = HF.el('line', { x1: GX - 30, y1: GY + 2 * CH + 30, x2: GX + 2 * CW + 10, y2: GY + 2 * CH + 30, stroke: '#C9D3F2', 'stroke-width': 6, 'stroke-linecap': 'round' }, axes);
      HF.el('path', { d: `M${GX - 44} ${GY + 4} L${GX - 30} ${GY - 20} L${GX - 16} ${GY + 4} Z`, fill: '#C9D3F2' }, axes);
      HF.el('path', { d: `M${GX + 2 * CW - 4} ${GY + 2 * CH + 16} L${GX + 2 * CW + 20} ${GY + 2 * CH + 30} L${GX + 2 * CW - 4} ${GY + 2 * CH + 44} Z`, fill: '#C9D3F2' }, axes);
      const yLen = 2 * CH + 12, xLen = 2 * CW + 40;
      gsap.set(yAx, { attr: { 'stroke-dasharray': yLen, 'stroke-dashoffset': yLen } });
      gsap.set(xAx, { attr: { 'stroke-dasharray': xLen, 'stroke-dashoffset': xLen } });
      const yT = HF.label('Cost pressure', { x: GX - 70, y: GY + CH, cls: 'sm', anchor: 'right' });
      const yHi = HF.label('high', { x: GX - 70, y: GY + CH / 2, cls: 'sm hf-gold', anchor: 'right' });
      const yLo = HF.label('low', { x: GX - 70, y: GY + CH * 1.5, cls: 'sm hf-teal', anchor: 'right' });
      const xT = HF.label('Pressure to adapt', { x: GX + CW, y: GY + 2 * CH + 70, cls: 'sm' });
      const xLo = HF.label('low', { x: GX + CW / 2, y: GY + 2 * CH + 70, cls: 'sm hf-teal' });
      const xHi = HF.label('high', { x: GX + CW * 1.5, y: GY + 2 * CH + 70, cls: 'sm hf-gold' });

      const light = (k, at) => {
        const c = cells[k];
        tl.to(c.glow, { opacity: 0.28, duration: 0.2 }, at);
        HF.pop(tl, c.ic, at + 0.05);
        HF.pop(tl, c.tag, at + 0.2);
      };

      // ================================================================ choreography
      // 0.0–0.6 axes and grid
      tl.to(yAx, { attr: { 'stroke-dashoffset': 0 }, duration: 0.3, ease: 'power2.out' }, 0.0);
      tl.to(xAx, { attr: { 'stroke-dashoffset': 0 }, duration: 0.3, ease: 'power2.out' }, 0.08);
      tl.to(Object.values(cells).map((c) => c.bg), { opacity: 1, duration: 0.25, stagger: 0.04 }, 0.1);
      HF.pop(tl, [yT, xT], 0.25, { stagger: 0.05 });
      HF.pop(tl, [yLo, yHi, xLo, xHi], 0.2, { stagger: 0.03 });

      // 0.6–1.4 home replication
      light('home', 0.65);
      // 1.4–2.2 multidomestic
      light('multi', 1.45);
      // 2.2–2.8 the open question
      HF.pop(tl, qIn, 2.25);
      tl.to(qIn, { keyframes: { scale: [1, 1.12, 1] }, duration: 0.4, ease: 'none' }, 2.38);
      // 2.8–3.8 global
      tl.to(qIn, { scale: 0, duration: 0.12 }, 2.85);
      light('global', 2.95);
      // 3.8–4.6 transnational
      light('trans', 3.8);
      tl.to(cells.trans.ic, { rotation: 0, keyframes: { scale: [1, 1.06, 1] }, duration: 0.3, ease: 'none' }, 4.3);
    })();
  </script>
  <script type="module" src="../../kit/kit-three.js"></script>
</body>
</html>

terms:
  - id: international-strategy
    term: International strategy
    short: A plan that guides how a firm uses its scarce resources to reach its goals in markets abroad.
    related: [competitive-advantage, strategic-planning]
    skills: [strategy-basics]
  - id: competitive-advantage
    term: Competitive advantage
    short: A firm's ability to win and keep a valuable position in its market, earning higher profits than rivals.
    related: [core-competencies]
    skills: [strategy-basics]
  - id: core-competencies
    term: Core competencies
    aka: [competencies, competency]
    short: The special strengths of a firm that customers value, rivals lack and others find hard to copy or replace.
    related: [competitive-advantage]
    skills: [strategy-basics]
  - id: strategic-planning
    term: Strategic planning
    short: The process by which an organization decides where it is going, how it will get there and how it will judge success.
    related: [international-strategy]
    skills: [strategy-basics]
  - id: economic-value-creation
    term: Economic value creation
    short: The gap between what customers are willing to pay for a product and what it costs to make.
    formula: '\text{value created} = \text{willingness to pay} - \text{unit cost}'
    related: [competitive-advantage, value-chain]
    skills: [value-creation]
  - id: liability-of-foreignness
    term: Liability of foreignness
    short: The extra costs a firm faces simply because it is new to a foreign country.
    related: [liability-of-newness]
    skills: [value-creation]
  - id: liability-of-newness
    term: Liability of newness
    short: The extra costs a firm faces when it enters a market or industry that is new to it.
    related: [liability-of-foreignness]
    skills: [value-creation]
  - id: formal-institutions
    term: Formal institutions
    short: Laws and regulations that shape how people and firms behave.
    related: [informal-institutions]
    skills: [value-creation]
  - id: informal-institutions
    term: Informal institutions
    short: Norms, values, customs and beliefs that shape behavior without being written down as law.
    related: [formal-institutions]
    skills: [value-creation]
  - id: value-chain
    term: Value chain
    short: The linked set of activities that add value to the final product or service.
    related: [economic-value-creation, cost-leadership]
    skills: [value-creation]
  - id: cost-leadership
    term: Cost leadership
    short: A way of competing by keeping costs lower than rivals.
    related: [product-differentiation, economies-of-scale]
    skills: [value-creation, cost-leadership]
  - id: product-differentiation
    term: Product differentiation
    short: A way of competing by offering customers more value than rivals while keeping costs under control.
    related: [cost-leadership]
    skills: [value-creation]
  - id: economies-of-scale
    term: Economies of scale
    short: The fall in average cost per unit as a plant gets larger and output rises.
    formula: '\text{average cost} = \dfrac{\text{fixed cost}}{\text{units}} + \text{variable cost}'
    related: [learning-curve, cost-leadership]
    skills: [cost-leadership]
  - id: learning-curve
    term: Learning curve
    aka: [experience curve, learning curve effects]
    short: The drop in cost per unit as a firm repeats a task or product again and again over time.
    formula: '\text{cost} = \text{first-unit cost} \times r^{d}'
    related: [economies-of-scale]
    skills: [cost-leadership]
  - id: home-replication-strategy
    term: Home replication strategy
    short: Keeping product development at home and transferring existing products and processes abroad.
    related: [multidomestic-strategy]
    skills: [strategy-types]
  - id: multidomestic-strategy
    term: Multidomestic strategy
    short: Adapting products and services to each local market, which works when pressure to adapt is strong.
    related: [global-strategy]
    skills: [strategy-types]
  - id: global-strategy
    term: Global strategy
    short: Offering standard products worldwide to cut costs, which works when cost pressure is strong and the need to adapt is small.
    related: [multidomestic-strategy, transnational-strategy]
    skills: [strategy-types]
  - id: transnational-strategy
    term: Transnational strategy
    short: Standardizing when possible and adapting when necessary, which suits strong pressure for both low cost and local fit.
    related: [global-strategy, blue-ocean-strategy]
    skills: [strategy-types]
  - id: blue-ocean-strategy
    term: Blue ocean strategy
    short: Creating a new market space with little or no competition instead of fighting rivals in a crowded one.
    related: [transnational-strategy]
    skills: [strategy-types]
  - id: mission-statement
    term: Mission statement
    short: A short statement of an organization's purpose and scope, such as Google's aim to organize the world's information.
    related: [vision-statement, values-statement]
    skills: [planning-steps]
  - id: vision-statement
    term: Vision statement
    short: A description of the future position the organization wants to reach if it builds the right strengths.
    related: [mission-statement]
    skills: [planning-steps]
  - id: values-statement
    term: Values statement
    short: A short description of the beliefs and priorities members of the organization are expected to live by.
    related: [mission-statement]
    skills: [planning-steps]
  - id: objectives
    term: Objectives
    aka: [corporate objectives, objective]
    short: Goals that direct the firm's actions within its mission and vision. They are best stated in numbers.
    related: [mission-statement, tactical-plan]
    skills: [planning-steps]
  - id: knowledge-management
    term: Knowledge management
    short: The practice of finding, creating, sharing and using knowledge that gives a firm an edge.
    related: [tacit-knowledge, explicit-knowledge]
    skills: [planning-steps]
  - id: tacit-knowledge
    term: Tacit knowledge
    short: Know-how that is hard to put into words, pictures or formulas, and so hard to pass on to others.
    related: [explicit-knowledge]
    skills: [planning-steps]
  - id: explicit-knowledge
    term: Explicit knowledge
    short: Knowledge that is easy to pass on in words, pictures, formulas or other forms.
    related: [tacit-knowledge]
    skills: [planning-steps]
  - id: tactical-plan
    term: Tactical plan
    aka: [operational plan, tactical plans]
    short: A detailed plan that spells out how the objectives will be reached.
    related: [objectives, budget]
    skills: [budgeting]
  - id: sales-forecast
    term: Sales forecast
    short: A prediction of how much the firm will sell in the future.
    related: [budget]
    skills: [budgeting]
  - id: budget
    term: Budget
    aka: [budgets]
    short: An itemized projection of income and spending for a future period.
    related: [sales-forecast, tactical-plan]
    skills: [budgeting]
  - id: balanced-scorecard
    term: Balanced scorecard
    short: A way of measuring strategy success with several kinds of measures, not only money.
    related: [objectives]
    skills: [budgeting]
  - id: scenario
    term: Scenario
    aka: [scenarios]
    short: One of several plausible stories about how the future might unfold.
    related: [contingency-plan]
    skills: [scenarios]
  - id: contingency-plan
    term: Contingency plan
    aka: [contingency plans]
    short: A plan prepared in advance for a critical event that could badly hurt the firm.
    related: [scenario]
    skills: [scenarios]
  - id: top-down-planning
    term: Top-down planning
    short: Planning that begins at the highest level of the organization and moves downward.
    related: [bottom-up-planning, iterative-planning]
    skills: [scenarios]
  - id: bottom-up-planning
    term: Bottom-up planning
    short: Planning that begins at the lowest level of the organization and moves upward.
    related: [top-down-planning, iterative-planning]
    skills: [scenarios]
  - id: iterative-planning
    term: Iterative planning
    short: Repeating top-down or bottom-up planning until all differences between levels are settled.
    related: [top-down-planning, bottom-up-planning]
    skills: [scenarios]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Qdigo motion kit</title>
  <link rel="stylesheet" href="kit/kit.css">
  <script src="kit/vendor/gsap.min.js"></script>
  <script src="kit/kit.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="kit-preview" data-start="0" data-width="1280" data-height="720" data-duration="3"></div>
  <script>
// The project's index.html: a 3 s card with the palette and a character, as a style reference in Studio.
(() => {
  const { C } = HF;
  const tl = HF.timeline(3);
  window.__timelines['kit-preview'] = tl;
  const L = HF.layer('swatches');
  const sw = [C.teal, C.coral, C.gold, C.violet].map((c, i) => HF.disc(L, { x: 400 + i * 160, y: 300, r: 50, color: c }));
  const ch = HF.character(L, { x: 640, y: 560, color: C.teal, size: 1.4 });
  const t = HF.label('Qdigo motion kit', { x: 640, y: 150, cls: 'lg' });
  HF.pop(tl, sw, 0.1, { stagger: 0.12 });
  HF.pop(tl, ch.g, 0.7, { origin: '50% 100%' });
  HF.say(tl, t, 1.0);
})();
  </script>
  <script type="module" src="kit/kit-three.js"></script>
</body>
</html>

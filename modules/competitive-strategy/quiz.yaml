templates:
  # ------------------------------------------------------------------ strategy-basics
  - id: competencies-multi
    type: multi
    skills: [strategy-basics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-a-strategy }
    prompt: Which tests must a competency pass to give a firm a lasting competitive advantage?
    options:
      - It creates value customers will pay for
      - It is rare in the market
      - It is difficult to imitate or replace
      - It is the same as every rival's
      - It can be copied by anyone in a week
    answer: [0, 1, 2]
    hints:
      - Think of what makes something hard for rivals to match.
    explanation: A competency must be valuable, rare and hard to copy or substitute, and the firm must be able to use it.

  - id: advantage-mcq
    type: mcq
    skills: [strategy-basics]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: why-a-strategy }
    prompt: A firm holds a position that earns it higher profits than its rivals and is hard to copy. This is its…
    options:
      - Competitive advantage
      - Mission statement
      - Contingency plan
      - Budget
    answer: 0
    hints:
      - The word advantage is the clue.
    explanation: Competitive advantage is a unique, valuable position that earns higher profits than competitors.

  - id: planning-why-mcq
    type: mcq
    skills: [strategy-basics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-a-strategy }
    prompt: According to the lecture, why plan strategy globally?
    options:
      - It finds opportunities and threats and gives decision makers a common understanding
      - It guarantees that no mistakes will happen
      - It removes the need for managers
      - It only matters in stable markets
    answer: 0
    hints:
      - Think of what a shared plan gives a team.
    explanation: Planning helps spot opportunities and threats, aligns decision makers and encourages new ideas.

  # ------------------------------------------------------------------ value-creation
  - id: value-created-numeric
    type: numeric
    skills: [value-creation]
    difficulty: 1
    tags: [math]
    generator: valueQ
    lessonRef: { tab: math-code, id: value-creation }
    prompt: |
      Customers will pay up to **{=willingness}** dollars for a product. The firm sells it for **{=price}** and it costs **{=unitCost}** to make. How much economic value does the firm create per unit?
    answer: { var: created, tol: 0.01 }
    misconceptions:
      - { var: wrongPrice, feedback: 'The price is not the value created. Value created is what customers will pay minus the cost.' }
      - { var: wrongSum, feedback: 'You added. Subtract the cost from what customers will pay.' }
    hints:
      - Economic value is the gap between willingness to pay and cost.
    explanation: |
      $ {=willingness} - {=unitCost} = {=created}$ dollars per unit.

  - id: surplus-numeric
    type: numeric
    skills: [value-creation]
    difficulty: 1
    tags: [math]
    generator: valueQ
    lessonRef: { tab: math-code, id: value-creation }
    prompt: |
      Customers will pay up to **{=willingness}** dollars. The product is priced at **{=price}** and costs **{=unitCost}** to make. How much of the value does the customer keep?
    answer: { var: surplus, tol: 0.01 }
    misconceptions:
      - { var: profit, feedback: 'That is the firm''s share (price minus cost). The customer keeps willingness to pay minus price.' }
      - { var: created, feedback: 'That is the total value created. The customer keeps only the part not charged.' }
    hints:
      - The customer keeps the part the firm does not charge.
    explanation: |
      $ {=willingness} - {=price} = {=surplus}$ dollars. The firm keeps {=profit}.

  - id: value-handcalc
    type: hand-calc
    skills: [value-creation]
    difficulty: 2
    tags: [math]
    generator: valueQ
    lessonRef: { tab: math-code, id: value-creation }
    prompt: |
      Willingness to pay **{=willingness}**, price **{=price}**, unit cost **{=unitCost}**.
    steps:
      - prompt: What is the value created?
        answer: { var: created, tol: 0.01 }
        misconceptions:
          - { var: profit, feedback: 'That uses the price instead of willingness to pay.' }
        hint: Willingness to pay minus cost.
      - prompt: What does the customer keep?
        answer: { var: surplus, tol: 0.01 }
        misconceptions:
          - { var: profit, feedback: 'That is the firm''s share.' }
        hint: Willingness to pay minus price.
      - prompt: What does the firm keep?
        answer: { var: profit, tol: 0.01 }
        misconceptions:
          - { var: surplus, feedback: 'That is the customer''s share.' }
        hint: Price minus cost.
    hints:
      - The firm and the customer split the value created.
    explanation: |
      Created {=created}; customer {=surplus}; firm {=profit}. The two shares add to the value created.

  - id: value-code
    type: code-fill
    skills: [value-creation]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: value-creation }
    prompt: Complete the value creation function.
    code: |
      def value_created(willingness, unit_cost):
          return willingness __BLANK_1__ unit_cost
    blanks:
      '1': { accept: ['-'] }
    hints:
      - Value is a gap between two numbers.
    explanation: Economic value created is willingness to pay minus unit cost.

  - id: positions-match
    type: match
    skills: [value-creation]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: creating-value }
    prompt: Match each term to its meaning.
    pairs:
      - ['[[cost-leadership|Cost leadership]]', 'Keeping costs lower than rivals']
      - ['[[product-differentiation|Product differentiation]]', 'Delivering more value than rivals while controlling costs']
      - ['[[liability-of-foreignness|Liability of foreignness]]', 'Extra costs of entering a foreign country']
      - ['[[value-chain|Value chain]]', 'Linked activities that add value to a product']
    hints:
      - One is a way to compete and one is an extra cost.
    explanation: Firms compete on cost or on differentiation, and pay extra costs when entering unfamiliar places.

  - id: institutions-mcq
    type: mcq
    skills: [value-creation]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: creating-value }
    prompt: Customs and norms that shape behavior in a country without being written law are…
    options:
      - Informal institutions
      - Formal institutions
      - Tactical plans
      - Core competencies
    answer: 0
    hints:
      - Formal institutions are laws and regulations.
    explanation: Informal institutions work through norms, values, customs and ideologies.

  # ------------------------------------------------------------------ cost-leadership
  - id: avgcost-numeric
    type: numeric
    skills: [cost-leadership]
    difficulty: 1
    tags: [math]
    generator: avgCostQ
    lessonRef: { tab: math-code, id: scale-economies }
    prompt: |
      A plant has fixed costs of **{=fixedCost|comma}** dollars and variable costs of **{=variableCost}** dollars per unit. It makes **{=units|comma}** units. What is the average cost per unit?
    answer: { var: average, tol: 0.01 }
    misconceptions:
      - { var: spread, feedback: 'That is only the fixed cost per unit. Add the variable cost.' }
      - { var: wrongSumAll, feedback: 'You added the totals without dividing by units. Spread the fixed cost over the units first.' }
    hints:
      - Spread the fixed cost over the units.
      - Add the variable cost per unit.
    explanation: |
      $ {=fixedCost|comma} / {=units|comma} + {=variableCost} = {=average|comma2}$ dollars per unit.

  - id: avgcost-handcalc
    type: hand-calc
    skills: [cost-leadership]
    difficulty: 2
    tags: [math]
    generator: avgCostQ
    lessonRef: { tab: math-code, id: scale-economies }
    prompt: |
      Fixed costs **{=fixedCost|comma}**, variable cost **{=variableCost}** per unit, output **{=units|comma}** units.
    steps:
      - prompt: What is the fixed cost per unit?
        answer: { var: spread, tol: 0.01 }
        misconceptions:
          - { var: average, feedback: 'That also includes the variable cost.' }
        hint: Fixed cost divided by units.
      - prompt: What is the average cost per unit?
        answer: { var: average, tol: 0.01 }
        misconceptions:
          - { var: spread, feedback: 'Add the variable cost per unit.' }
        hint: Fixed cost per unit plus variable cost.
    hints:
      - Fixed cost first.
    explanation: |
      Fixed per unit {=spread|comma2}; average {=average|comma2}.

  - id: learn-numeric
    type: numeric
    skills: [cost-leadership]
    difficulty: 2
    tags: [math]
    generator: learnQ
    lessonRef: { tab: math-code, id: learning-curve }
    prompt: |
      The first unit costs **{=firstCost}** dollars. Each time cumulative output doubles, cost per unit falls to **{=pct}%** of its previous level. What does a unit cost after **{=doublings}** doublings?
    answer: { var: cost, tol: 0.5 }
    misconceptions:
      - { var: wrongOnce, feedback: 'You applied the rate only once. Apply it for every doubling.' }
      - { var: wrongLinear, feedback: 'You subtracted a fixed amount each time. The cost is multiplied by the rate at each doubling.' }
    hints:
      - Each doubling multiplies the cost by the same rate.
      - Multiply the first cost by the rate once for every doubling.
    explanation: |
      $ {=firstCost} \times {=rate}^{ {=doublings} } = {=cost|2}$ dollars.

  - id: scale-mcq
    type: mcq
    skills: [cost-leadership]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: getting-cheaper }
    prompt: Why does average cost per unit fall as a plant makes more units?
    options:
      - The fixed cost is spread over more units
      - Variable cost per unit disappears
      - Workers are paid less
      - Prices fall automatically
    answer: 0
    hints:
      - What does not change when output rises?
    explanation: Fixed cost does not change with output, so each extra unit carries a smaller share of it.

  - id: avgcost-code
    type: code-fill
    skills: [cost-leadership]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: scale-economies }
    prompt: Complete the average cost function.
    code: |
      def average_cost(fixed, variable, units):
          return fixed __BLANK_1__ units + variable
    blanks:
      '1': { accept: ['/'] }
    hints:
      - Spread means divide.
    explanation: Average cost is the fixed cost spread over the units plus the variable cost.

  - id: learning-order
    type: order
    skills: [cost-leadership]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: learning-curve }
    prompt: Put the steps of using a learning curve in order.
    items:
      - Find the cost of the first unit
      - Find the rate by which cost falls at each doubling
      - Count the doublings of cumulative output
      - Multiply the first cost by the rate once per doubling
    hints:
      - You need the rate and the count before multiplying.
    explanation: The cost after a number of doublings is the first cost times the rate to that power.

  # ------------------------------------------------------------------ strategy-types
  - id: strategy-mcq
    type: mcq
    skills: [strategy-types]
    difficulty: 1
    tags: [math]
    generator: strategyQ
    lessonRef: { tab: math-code, id: strategy-chooser }
    prompt: |
      A firm faces **{=cost}** pressure to cut costs and **{=adapt}** pressure to adapt to local markets. Which strategy fits?
    hints:
      - High cost pressure points to standardizing; high adaptation pressure points to local versions.
    explanation: |
      Cost pressure {=cost} and adaptation pressure {=adapt} call for a **{=strategy}** strategy.

  - id: strategy-match
    type: match
    skills: [strategy-types]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: pick-a-strategy }
    prompt: Match each strategy to its idea.
    pairs:
      - ['[[home-replication-strategy|Home replication]]', 'Transfer existing products and processes from home']
      - ['[[multidomestic-strategy|Multidomestic]]', 'Adapt products to each local market']
      - ['[[global-strategy|Global]]', 'Standard products, costs cut by using the best locations']
      - ['[[transnational-strategy|Transnational]]', 'Standardize when possible and adapt when necessary']
    hints:
      - Which one adapts the most?
    explanation: The four strategies differ in how much they standardize and how much they adapt.

  - id: strategy-code
    type: code-fill
    skills: [strategy-types]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: strategy-chooser }
    prompt: Complete the strategy chooser.
    code: |
      STRATEGY = {("high", "low"): "Global", ("high", "high"): "Transnational"}

      def choose(cost, adapt):
          return STRATEGY[(__BLANK_1__, __BLANK_2__)]
    blanks:
      '1': { accept: ['cost'] }
      '2': { accept: ['adapt'] }
    hints:
      - The key is a pair of pressures.
    explanation: The strategy depends on the pair of pressures.

  - id: kfc-mcq
    type: mcq
    skills: [strategy-types]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: pick-a-strategy }
    prompt: KFC changes its menus in China to suit local tastes. This is an example of which strategy?
    options:
      - Multidomestic
      - Global
      - Home replication
      - Transnational only
    answer: 0
    hints:
      - Which strategy adapts products to each local market?
    explanation: The lecture uses KFC's international operations as an illustration of a multidomestic strategy.

  # ------------------------------------------------------------------ planning-steps
  - id: planning-order
    type: order
    skills: [planning-steps]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: mission-and-goals }
    prompt: Put the steps of global strategic planning in the lecture's order.
    items:
      - Analyze the external environments
      - Analyze the company's internal environment
      - Define the vision and mission
      - Set corporate objectives
      - Quantify the goals
      - Formulate strategies
      - Make tactical plans
    hints:
      - Look outside, then inside, then decide where you are going.
    explanation: The process runs from analysis, through direction and goals, to strategies and detailed plans.

  - id: statements-match
    type: match
    skills: [planning-steps]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: mission-and-goals }
    prompt: Match each statement type to what it expresses.
    pairs:
      - ['[[mission-statement|Mission statement]]', 'The organization''s purpose and scope']
      - ['[[vision-statement|Vision statement]]', 'The desired future position']
      - ['[[values-statement|Values statement]]', 'The beliefs and priorities members are expected to live by']
    hints:
      - Which looks into the future?
    explanation: Mission is why you exist, vision is where you want to be, and values are how you behave.

  - id: knowledge-mcq
    type: mcq
    skills: [planning-steps]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: mission-and-goals }
    prompt: A master chef's feel for when a dish is ready is hard to write down. This is…
    options:
      - Tacit knowledge
      - Explicit knowledge
      - A values statement
      - A budget
    answer: 0
    hints:
      - Can it be put clearly into words or formulas?
    explanation: Know-how that is hard to express and pass on is tacit knowledge. A written recipe is explicit.

  - id: objective-mcq
    type: mcq
    skills: [planning-steps]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: mission-and-goals }
    prompt: Why does the lecture prefer objectives that are quantified?
    options:
      - They can be turned into strategies and checked against results
      - Vague goals are easier to reach
      - Numbers are required by law
      - They replace the mission
    answer: 0
    hints:
      - How would you know a goal was met?
    explanation: Quantified objectives make strategy-building and progress checks possible. They get more specific at lower levels.

  # ------------------------------------------------------------------ budgeting
  - id: forecast-numeric
    type: numeric
    skills: [budgeting]
    difficulty: 1
    tags: [math]
    generator: budgetQ
    lessonRef: { tab: math-code, id: budget-forecast }
    prompt: |
      Sales last year were **{=lastSales|comma}** dollars and are expected to grow **{=growth|pct}**. What is the sales forecast?
    answer: { var: forecast, tol: 0.5 }
    misconceptions:
      - { var: wrongNoGrowth, feedback: 'That is last year''s sales. Apply the growth.' }
      - { var: wrongAddRate, feedback: 'You added the rate to the sales. Multiply the sales by one plus the rate.' }
    hints:
      - Growth of 10% means 110% of last year.
    explanation: |
      $ {=lastSales|comma} \times (1 + {=growth|2}) = {=forecast|comma}$.

  - id: budget-numeric
    type: numeric
    skills: [budgeting]
    difficulty: 2
    tags: [math]
    generator: budgetQ
    lessonRef: { tab: math-code, id: budget-forecast }
    prompt: |
      Last year's sales were **{=lastSales|comma}** and will grow **{=growth|pct}**. Costs are **{=costRatio|pct}** of sales plus fixed expenses of **{=fixedExpenses|comma}**. What is the budgeted profit?
    answer: { var: net, tol: 0.5 }
    misconceptions:
      - { var: wrongNetOld, feedback: 'You used last year''s sales. Forecast the sales first.' }
      - { var: forecast, feedback: 'That is only the sales forecast. Take away expenses.' }
    hints:
      - Forecast the sales, then find expenses, then subtract.
    explanation: |
      Forecast {=forecast|comma}; expenses {=expenses|comma}; profit {=net|comma}.

  - id: budget-handcalc
    type: hand-calc
    skills: [budgeting]
    difficulty: 3
    tags: [math]
    generator: budgetQ
    lessonRef: { tab: math-code, id: budget-forecast }
    prompt: |
      Last year's sales **{=lastSales|comma}**, growth **{=growth|pct}**, costs **{=costRatio|pct}** of sales, fixed expenses **{=fixedExpenses|comma}**.
    steps:
      - prompt: What is the sales forecast?
        answer: { var: forecast, tol: 0.5 }
        misconceptions:
          - { var: wrongNoGrowth, feedback: 'Apply the growth.' }
        hint: Sales times one plus growth.
      - prompt: What are the total expenses?
        answer: { var: expenses, tol: 0.5 }
        misconceptions:
          - { var: fixedExpenses, feedback: 'You left out the costs that depend on sales.' }
        hint: Cost ratio times forecast, plus fixed expenses.
      - prompt: What is the budgeted profit?
        answer: { var: net, tol: 0.5 }
        misconceptions:
          - { var: forecast, feedback: 'Subtract the expenses.' }
        hint: Forecast minus expenses.
    hints:
      - Three steps, in order.
    explanation: |
      Forecast {=forecast|comma}; expenses {=expenses|comma}; profit {=net|comma}.

  - id: budget-code
    type: code-fill
    skills: [budgeting]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: budget-forecast }
    prompt: Complete the budget function.
    code: |
      def budget(last_sales, growth, cost_ratio, fixed):
          forecast = last_sales * (1 + __BLANK_1__)
          expenses = forecast * cost_ratio + __BLANK_2__
          return forecast - expenses
    blanks:
      '1': { accept: ['growth'] }
      '2': { accept: ['fixed'] }
    hints:
      - Expenses have a part that varies and a part that does not.
    explanation: Forecast the sales, add up expenses, and subtract.

  # ------------------------------------------------------------------ scenarios
  - id: common-numeric
    type: numeric
    skills: [scenarios]
    difficulty: 2
    tags: [math]
    generator: commonQ
    lessonRef: { tab: math-code, id: scenario-actions }
    prompt: |
      A team lists actions for each possible future: **{=text}**. How many actions appear in every story?
    answer: { var: count, tol: 0.1 }
    misconceptions:
      - { var: total, feedback: 'That counts every different action. Count only those that appear in all the stories.' }
      - { var: wrongFirst, feedback: 'That is the length of the first list. Count the actions that also appear in every other list.' }
    hints:
      - Look for actions that appear in every list.
    explanation: |
      {=count} action(s) appear in all {=stories} stories. Those are the safest to do first.

  - id: scenario-order
    type: order
    skills: [scenarios]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: imagining-futures }
    prompt: Put the steps of scenario planning in order.
    items:
      - Decide the area, scope and timing of the decisions that matter
      - Research existing conditions and trends
      - Examine the drivers that will shape the stories
      - Construct several stories of what could happen
      - Play out the impact of each story
      - Look for actions common to all the stories
      - Monitor what develops
    hints:
      - Stories come after research and before testing the actions.
    explanation: The last steps look for robust actions and watch which story is unfolding.

  - id: methods-match
    type: match
    skills: [scenarios]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: imagining-futures }
    prompt: Match each planning method to how it works.
    pairs:
      - ['[[top-down-planning|Top-down planning]]', 'Begins at the highest level and moves down']
      - ['[[bottom-up-planning|Bottom-up planning]]', 'Begins at the lowest level and moves up']
      - ['[[iterative-planning|Iterative planning]]', 'Repeats until the levels agree']
    hints:
      - Which repeats?
    explanation: Iterative planning repeats top-down or bottom-up passes until differences are reconciled.

  - id: contingency-mcq
    type: mcq
    skills: [scenarios]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: imagining-futures }
    prompt: A firm prepares in advance for a critical event that could badly damage it. This is a…
    options:
      - Contingency plan
      - Mission statement
      - Sales forecast
      - Value chain
    answer: 0
    hints:
      - Contingent means depending on something that might happen.
    explanation: Contingency plans prepare for critical events with a severe impact on the firm.

  - id: common-code
    type: code-fill
    skills: [scenarios]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: scenario-actions }
    prompt: Complete the function that finds actions common to every story.
    code: |
      def common_actions(stories):
          common = set(stories[0])
          for story in stories[1:]:
              common = common __BLANK_1__ set(story)
          return common
    blanks:
      '1': { accept: ['&', '.intersection('] }
    hints:
      - Which set operation keeps only items in both?
    explanation: Intersection keeps only the actions that appear in both sets.

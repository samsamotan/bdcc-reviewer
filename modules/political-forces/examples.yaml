examples:
  - id: piracy-2013
    source: 'M5, slide 12 (Table 5.1, 2013)'
    fn: piracyYear
    in: { table: '@piracy', year: '2013' }
    expect: { total: 264, printed: 264, africa: 79, asia: 167, latam: 18, rest: 0, matches: true, topRegion: Asia }
    tol: 0.001
  - id: piracy-2017
    source: 'M5, slide 12 (Table 5.1, 2017)'
    fn: piracyYear
    in: { table: '@piracy', year: '2017' }
    expect: { total: 321, topRegion: Africa, africa: 151 }
    tol: 0.001
  - id: piracy-2018
    source: 'M5, slide 12 (Table 5.1, 2018)'
    fn: piracyYear
    in: { table: '@piracy', year: '2018' }
    expect: { total: 304, shareAfrica: 0.398, shareLatam: 0.28 }
    tol: 0.005
  - id: piracy-2020
    source: 'M5, slide 13 (Table 5.1, 2020)'
    fn: piracyYear
    in: { table: '@piracy', year: '2020' }
    expect: { total: 195, rest: 64, topRegion: Rest of world }
    tol: 0.001
  - id: piracy-2022
    source: 'M5, slide 13 (Table 5.1, 2022)'
    fn: piracyYear
    in: { table: '@piracy', year: '2022' }
    expect: { total: 115, matches: true }
    tol: 0.001
  - id: piracy-2013-2018
    source: 'M5, slides 12 (totals 264 and 304)'
    fn: piracyChange
    in: { table: '@piracy', from: '2013', to: '2018' }
    expect: { change: 40, pct: 0.1515 }
    tol: 0.001
  - id: piracy-2018-2022
    source: 'M5, slides 12-13 (totals 304 and 115)'
    fn: piracyChange
    in: { table: '@piracy', from: '2018', to: '2022' }
    expect: { change: -189, pct: -0.6217 }
    tol: 0.001
  - id: duty-ad-valorem
    source: 'Beyond the slides: ad valorem duty defined on slide 17'
    fn: importDuty
    in: { value: 10000, units: 500, adValoremRate: 0.1, specificPerUnit: 0 }
    expect: { duty: 1000, landed: 11000, kind: ad valorem }
    tol: 0.005
  - id: duty-specific
    source: 'Beyond the slides: specific duty defined on slide 17'
    fn: importDuty
    in: { value: 10000, units: 500, adValoremRate: 0, specificPerUnit: 2 }
    expect: { duty: 1000, kind: specific }
    tol: 0.005
  - id: duty-compound
    source: 'Beyond the slides: compound duty defined on slide 17'
    fn: importDuty
    in: { value: 10000, units: 500, adValoremRate: 0.1, specificPerUnit: 2 }
    expect: { adValorem: 1000, specific: 1000, duty: 2000, landed: 12000, kind: compound, dutyPct: 0.2 }
    tol: 0.005
  - id: variable-levy-example
    source: 'Beyond the slides: variable levy defined on slide 17'
    fn: variableLevy
    in: { worldPrice: 300, supportedPrice: 350 }
    expect: { levy: 50, entryPrice: 350 }
    tol: 0.005
  - id: variable-levy-none
    source: 'Beyond the slides: variable levy defined on slide 17'
    fn: variableLevy
    in: { worldPrice: 400, supportedPrice: 350 }
    expect: { levy: 0, entryPrice: 400 }
    tol: 0.005
  - id: dumping-yes
    source: 'Beyond the slides: dumping defined on slide 21'
    fn: dumpingTest
    in: { exportPrice: 90, homePrice: 100, cost: 95 }
    expect: { belowHome: true, belowCost: true, dumping: true, marginVsHome: 10 }
    tol: 0.005
  - id: dumping-no
    source: 'Beyond the slides: dumping defined on slide 21'
    fn: dumpingTest
    in: { exportPrice: 110, homePrice: 100, cost: 95 }
    expect: { dumping: false, marginVsHome: 0 }
    tol: 0.005
  - id: protection-cost-example
    source: 'Beyond the slides: the cost of protecting jobs, slide 26'
    fn: protectionCost
    in: { risePerUnit: 2, quantity: 50000, jobsProtected: 20 }
    expect: { buyersPay: 100000, perJob: 5000 }
    tol: 0.5
  - id: countervailing-example
    source: 'Beyond the slides: countervailing duties defined on slide 30'
    fn: countervailing
    in: { subsidyPerUnit: 2, units: 1000, importValue: 20000 }
    expect: { duty: 2000, rate: 0.1, newValue: 22000 }
    tol: 0.005

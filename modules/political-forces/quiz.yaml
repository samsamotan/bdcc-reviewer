templates:
  # ------------------------------------------------------------------ govt-role
  - id: systems-match
    type: match
    skills: [govt-role]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: economic-systems }
    prompt: Match each kind of economy to how it works.
    pairs:
      - ['[[market-economy|Market economy]]', 'Private businesses; supply and demand decide']
      - ['[[command-economy|Command economy]]', 'The government owns the major industries']
      - ['[[mixed-economy|Mixed economy]]', 'Some state-owned and some private businesses']
    hints:
      - Who owns the factories in each one?
    explanation: The three systems sit on a line from private ownership to state ownership. All of them involve some government role in business.

  - id: nationalize-multi
    type: multi
    skills: [govt-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: economic-systems }
    prompt: Which are reasons a government might nationalize a firm?
    options:
      - To follow an economic or political belief
      - To save jobs
      - To control earlier investments
      - To raise money by selling it
      - To cut the government's own bureaucracy
    answer: [0, 1, 2]
    hints:
      - Which two options describe selling a business instead?
    explanation: Nationalizing means the government takes ownership. Selling the firm or cutting bureaucracy are reasons for privatizing.

  - id: privatize-mcq
    type: mcq
    skills: [govt-role]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: economic-systems }
    prompt: A government sells a state-owned airline to private investors. This is…
    options:
      - Privatization
      - Nationalization
      - A quota
      - A subsidy
    answer: 0
    hints:
      - Which way does ownership move?
    explanation: Selling government-owned property to the private sector is privatization.

  - id: stp-mcq
    type: mcq
    skills: [govt-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: economic-systems }
    prompt: A government gives cash to its aircraft maker so it can undercut a foreign rival. This is an example of…
    options:
      - Strategic trade policy
      - A voluntary export restraint
      - Free trade
      - Privatization
    answer: 0
    hints:
      - Which tool is being used to shape how companies compete?
    explanation: Subsidies, tariffs and quotas used to shape how firms compete are strategic trade policy. The lecture warns it can reduce global welfare and innovation.

  # ------------------------------------------------------------------ stability-risk
  - id: piracy-share-numeric
    type: numeric
    skills: [stability-risk]
    difficulty: 1
    tags: [math]
    generator: piracyQ
    lessonRef: { tab: math-code, id: piracy-table }
    prompt: |
      In {=year} there were **{=total}** piracy incidents worldwide, and **{=count}** were in **{=region}**. What share of the year's incidents were in {=region}? (Answer as a decimal or a percent.)
    answer: { var: share, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongShare, feedback: 'You used a different region''s count. Divide this region''s count by the total.' }
      - { var: pct, feedback: 'That is the right number written as a plain percent. Write it with a percent sign, or as a decimal.' }
    hints:
      - A share is part divided by whole.
      - Divide the region's incidents by the total for the year.
    explanation: |
      $ {=count} / {=total} = {=share|3}$, about {=share|pct1} of all incidents.

  - id: piracy-handcalc
    type: hand-calc
    skills: [stability-risk]
    difficulty: 2
    tags: [math]
    generator: piracyQ
    lessonRef: { tab: math-code, id: piracy-table }
    prompt: |
      In {=year}, piracy incidents were Africa {=africa}, Asia {=asia}, Latin America and the Caribbean {=latam} and the rest of the world {=rest}.
    steps:
      - prompt: What is the total number of incidents?
        answer: { var: total, tol: 0.5 }
        misconceptions:
          - { var: wrongRegions, feedback: 'You left out one region. Add all four.' }
        hint: Add the four regions.
      - prompt: What share of the total were in {=region}? (As a decimal.)
        answer: { var: share, tol: 0.005 }
        misconceptions:
          - { var: wrongShare, feedback: 'That is another region. Use the region named in the question.' }
        hint: Region divided by the total.
    hints:
      - Add first, then divide.
    explanation: |
      Total $= {=total}$. Share of {=region} $= {=count} / {=total} = {=share|3}$.

  - id: piracy-change-numeric
    type: numeric
    skills: [stability-risk]
    difficulty: 2
    tags: [math]
    generator: changeQ
    lessonRef: { tab: math-code, id: piracy-table }
    prompt: |
      Total piracy incidents were **{=totalFrom}** in {=from} and **{=totalTo}** in {=to}. By what fraction did the total change? (Use a minus sign for a fall; decimal or percent.)
    answer: { var: pct, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongRev, feedback: 'You divided by the later year. Divide the change by the **starting** year.' }
      - { var: wrongDiff, feedback: 'That is the change in the count. Divide it by the starting count to get a fraction.' }
    hints:
      - Change = new total minus old total.
      - Divide the change by the old total.
    explanation: |
      $({=totalTo} - {=totalFrom}) / {=totalFrom} = {=pct|3}$.

  - id: stability-mcq
    type: mcq
    skills: [stability-risk]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: stability-and-risk }
    prompt: A government keeps power for years and its tax and money policies change little. This is…
    options:
      - Stability
      - Instability
      - Nationalization
      - A quota
    answer: 0
    hints:
      - Look for the word predictable.
    explanation: Stable governments keep power and keep policies predictable.

  - id: cra-multi
    type: multi
    skills: [stability-risk]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: stability-and-risk }
    prompt: Which of these would a country risk assessment look at?
    options:
      - Wars, revolutions and coups
      - Persistent balance-of-payments deficits
      - High inflation
      - Changes to tax, tariff or currency convertibility laws
      - The color of the national flag
    answer: [0, 1, 2, 3]
    hints:
      - The assessment covers politics, economics and the law.
    explanation: A country risk assessment studies a country's politics, finances and laws to judge risk to employees, property and investment.

  - id: risks-match
    type: match
    skills: [stability-risk]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: stability-and-risk }
    prompt: Match each threat to its description.
    pairs:
      - ['[[kidnapping|Kidnapping]]', 'Seizing people, often businesspeople, to demand money']
      - ['[[piracy|Piracy]]', 'Hijacking and kidnapping at sea']
      - ['[[cybercrime|Cybercrime]]', 'Illegal activity over electronic networks, such as ransomware']
      - ['[[terrorism|Terrorism]]', 'Unlawful violence for political or other aims']
    hints:
      - Which one happens only at sea?
    explanation: Each is a different threat that country risk planning has to cover.

  - id: piracy-code
    type: code-fill
    skills: [stability-risk]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: piracy-table }
    prompt: Complete the function that checks a year of Table 5.1.
    code: |
      def check_year(regions, printed):
          total = __BLANK_1__(regions)
          return total == __BLANK_2__
    blanks:
      '1': { accept: ['sum'] }
      '2': { accept: ['printed'] }
    hints:
      - Add the regions with a built-in function.
    explanation: The four regions should add to the printed total.

  # ------------------------------------------------------------------ duties
  - id: duty-landed-numeric
    type: numeric
    skills: [duties]
    difficulty: 1
    tags: [math]
    generator: dutyQ
    lessonRef: { tab: math-code, id: import-duty }
    prompt: |
      A shipment has an invoice value of **{=value|comma}** dollars and faces a **{=rate|pct}** ad valorem duty. What is the landed cost (value plus duty)?
    answer: { var: landed, tol: 0.5 }
    misconceptions:
      - { var: wrongLanded, feedback: 'That is only the duty. The landed cost also includes the goods themselves.' }
      - { var: wrongAddRate, feedback: 'You added the rate to the value. Multiply the rate by the value first.' }
    hints:
      - Ad valorem means a percentage of the value.
      - Duty = rate times value. Then add it to the value.
    explanation: |
      Duty $= {=rate|pct} \times {=value|comma} = {=duty|comma2}$. Landed cost $= {=value|comma} + {=duty|comma2} = {=landed|comma2}$.

  - id: duty-handcalc
    type: hand-calc
    skills: [duties]
    difficulty: 2
    tags: [math]
    generator: dutyQ
    lessonRef: { tab: math-code, id: import-duty }
    prompt: |
      {=units|comma} units worth **{=value|comma}** dollars arrive. The compound duty is **{=rate|pct}** of the value plus **{=specific}** dollars per unit.
    steps:
      - prompt: What is the ad valorem part?
        answer: { var: adValorem, tol: 0.5 }
        misconceptions:
          - { var: specificPart, feedback: 'That is the per-unit part. The ad valorem part is a percentage of value.' }
        hint: Rate times value.
      - prompt: What is the specific part?
        answer: { var: specificPart, tol: 0.5 }
        misconceptions:
          - { var: adValorem, feedback: 'That is the percentage part. The specific part is dollars per unit times units.' }
        hint: Dollars per unit times units.
      - prompt: What is the total duty?
        answer: { var: duty, tol: 0.5 }
        misconceptions:
          - { var: adValorem, feedback: 'You left out the specific part. A compound duty is both added together.' }
        hint: Add the two parts.
    hints:
      - Take the two parts separately.
    explanation: |
      Ad valorem $= {=adValorem|comma2}$. Specific $= {=specificPart|comma2}$. Duty $= {=duty|comma2}$.

  - id: specific-numeric
    type: numeric
    skills: [duties]
    difficulty: 2
    tags: [math]
    generator: dutyQ
    lessonRef: { tab: math-code, id: import-duty }
    prompt: |
      A **specific duty** of **{=specific} dollars per unit** applies to {=units|comma} imported units. How much duty is owed?
    answer: { var: specificPart, tol: 0.5 }
    misconceptions:
      - { var: wrongSpecificAsRate, feedback: 'You multiplied by the invoice value. A specific duty is charged per unit, not per dollar of value.' }
      - { var: specific, feedback: 'That is the duty for one unit. Multiply by the number of units.' }
    hints:
      - Specific means a fixed amount for each physical unit.
      - Amount per unit times number of units.
    explanation: |
      $ {=specific} \times {=units|comma} = {=specificPart|comma2}$ dollars.

  - id: compound-landed-numeric
    type: numeric
    skills: [duties]
    difficulty: 3
    tags: [math]
    generator: dutyQ
    lessonRef: { tab: math-code, id: import-duty }
    prompt: |
      {=units|comma} units with an invoice value of **{=value|comma}** dollars face a compound duty of **{=rate|pct}** plus **{=specific} dollars per unit**. What is the landed cost?
    answer: { var: landed, tol: 0.5 }
    misconceptions:
      - { var: wrongLanded, feedback: 'That is only the duty. Add the value of the goods.' }
      - { var: wrongAddRate, feedback: 'You added the rate to the value. Work out both duty parts first.' }
    hints:
      - Find the percentage part and the per-unit part.
      - Add both parts to the invoice value.
    explanation: |
      Duty $= {=adValorem|comma2} + {=specificPart|comma2} = {=duty|comma2}$. Landed cost $= {=landed|comma2}$.

  - id: duty-kind-mcq
    type: mcq
    skills: [duties]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: tariffs }
    prompt: A tariff of 5% of the invoice value plus 2 dollars per unit is a…
    options:
      - Compound duty
      - Specific duty
      - Ad valorem duty
      - Variable levy
    answer: 0
    hints:
      - How many kinds of charge does it combine?
    explanation: A duty that adds a percentage of value to a fixed amount per unit is a compound duty.

  - id: levy-numeric
    type: numeric
    skills: [levy]
    difficulty: 2
    tags: [math]
    generator: levyQ
    lessonRef: { tab: math-code, id: variable-levy }
    prompt: |
      The world price of a crop is **{=worldPrice}** and the government supports the local price at **{=supportedPrice}**. What variable levy is charged on an import?
    answer: { var: levy, tol: 0.5 }
    misconceptions:
      - { var: wrongSum, feedback: 'You added the two prices. A levy is their **difference**.' }
      - { var: wrongWorld, feedback: 'That is the world price. The levy is the gap up to the supported price.' }
    hints:
      - The levy closes the gap between two prices.
      - Supported price minus world price.
    explanation: |
      Levy $= {=supportedPrice} - {=worldPrice} = {=levy}$. Imports then enter at {=entry}.

  - id: duty-code
    type: code-fill
    skills: [duties]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: import-duty }
    prompt: Complete the compound duty function.
    code: |
      def import_duty(value, units, rate, per_unit):
          ad_valorem = rate * __BLANK_1__
          specific = per_unit * __BLANK_2__
          return ad_valorem + specific
    blanks:
      '1': { accept: ['value'] }
      '2': { accept: ['units'] }
    hints:
      - One part depends on value, the other on how many units.
    explanation: The ad valorem part is a share of the value and the specific part is charged per unit.

  - id: levy-code
    type: code-fill
    skills: [levy]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: variable-levy }
    prompt: Complete the variable levy function.
    code: |
      def variable_levy(world_price, supported_price):
          return __BLANK_1__(0, supported_price - __BLANK_2__)
    blanks:
      '1': { accept: ['max'] }
      '2': { accept: ['world_price'] }
    hints:
      - A levy is never negative.
    explanation: The levy is the gap, and it is never less than zero.

  - id: levy-order
    type: order
    skills: [levy]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: variable-levy }
    prompt: Put the steps of working out an import's price under a variable levy in order.
    items:
      - Find the world price
      - Find the government-supported local price
      - Subtract the world price from the supported price to get the levy
      - Add the levy to the world price to get the entry price
    hints:
      - You need both prices before you can find the gap.
    explanation: The levy fills the gap, so the imported good costs the same as the supported local one.

  # ------------------------------------------------------------------ trade-barriers
  - id: dump-mcq
    type: mcq
    skills: [trade-barriers]
    difficulty: 2
    tags: [math]
    generator: dumpQ
    lessonRef: { tab: math-code, id: dumping-test }
    prompt: |
      A firm sells a product abroad for **{=exportPrice}**. At home it sells for **{=homePrice}** and it costs **{=cost}** to make. Is this dumping?
    hints:
      - Dumping is selling abroad below cost or below the home price.
    explanation: |
      Export price {=exportPrice}, home price {=homePrice}, cost {=cost}. Dumping means below cost or below the home price.

  - id: ntb-match
    type: match
    skills: [trade-barriers]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: other-barriers }
    prompt: Match each barrier to its description.
    pairs:
      - ['[[quota|Quota]]', 'A numerical limit on imports of a class of goods']
      - ['[[voluntary-export-restraint|Voluntary export restraint]]', 'An export limit set by the exporting country itself']
      - ['[[local-content-requirement|Local content requirement]]', 'A rule to use domestically made goods and services']
      - ['[[import-ban|Import ban]]', 'A rule forbidding certain goods from coming in']
    hints:
      - Which one is set by the exporting country?
    explanation: These barriers all limit imports without using an import duty.

  - id: cvd-mcq
    type: mcq
    skills: [trade-barriers]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: other-barriers }
    prompt: A country finds that imports from abroad were helped by export subsidies. It adds an extra import tax to cancel the help. This tax is a…
    options:
      - Countervailing duty
      - Variable levy
      - Voluntary export restraint
      - Local content requirement
    answer: 0
    hints:
      - Which duty answers a subsidy?
    explanation: Countervailing duties are extra import taxes placed on goods that benefited from export subsidies.

  - id: ntb-multi
    type: multi
    skills: [trade-barriers]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: other-barriers }
    prompt: Which of these are nontariff barriers?
    options:
      - Quotas
      - Local content requirements
      - Product standards that favor local firms
      - An ad valorem duty
      - A specific duty
    answer: [0, 1, 2]
    hints:
      - Nontariff means anything other than an import duty.
    explanation: Quotas, local content rules and standards discriminate against imports without a duty. Ad valorem and specific duties are tariffs.

  - id: dump-code
    type: code-fill
    skills: [trade-barriers]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: dumping-test }
    prompt: Complete the dumping test.
    code: |
      def is_dumping(export_price, home_price, cost):
          below_home = export_price __BLANK_1__ home_price
          below_cost = export_price < __BLANK_2__
          return below_home or below_cost
    blanks:
      '1': { accept: ['<'] }
      '2': { accept: ['cost'] }
    hints:
      - Selling below something means less than it.
    explanation: Dumping is selling below the home price or below the cost of production.

  # ------------------------------------------------------------------ govt-role
  - id: motives-match
    type: match
    skills: [govt-role]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: political-reasons }
    prompt: Match each motive for restricting trade to its idea.
    pairs:
      - ['National defense', 'Protect industries vital to security']
      - ['[[sanctions|Sanctions]]', 'Punish a country or push it to change behavior']
      - ['[[retaliation|Retaliation]]', 'Strike back after dumping or subsidies']
      - ['[[infant-industry|Infant industry]]', 'Give a young industry time to grow']
    hints:
      - Which two are about answering another country's action?
    explanation: Governments restrict trade for political and economic reasons; each motive has a different logic.

  - id: sanction-mcq
    type: mcq
    skills: [govt-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: political-reasons }
    prompt: What does the lecture say about trade sanctions?
    options:
      - They seldom reach their goal and can hurt the country applying them
      - They always change the target's behavior
      - They only affect banks
      - They are the same as subsidies
    answer: 0
    hints:
      - Think about collateral damage.
    explanation: Sanctions seldom achieve their goal and produce collateral economic damage in the nations applying them.

  - id: infant-mcq
    type: mcq
    skills: [govt-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: economic-reasons }
    prompt: Why might a government shield an infant industry from imports?
    options:
      - So it can grow and build a strength of its own before facing lower-cost imports
      - So it never has to compete
      - To make consumers pay less
      - To raise world prices
    answer: 0
    hints:
      - Infant means still growing.
    explanation: Without help, lower-cost imports would underprice the young firms. Protection is meant to be temporary.

  - id: jobs-multi
    type: multi
    skills: [govt-role]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: political-reasons }
    prompt: Which statements match the lecture's view on protecting domestic jobs?
    options:
      - The "cheap foreign labor" argument ignores that wages are not the only production cost
      - Protecting farm jobs with tariffs can cost consumers a lot
      - Very low nuisance tariffs can still change what firms do
      - Tariffs always create net new jobs
    answer: [0, 1, 2]
    hints:
      - Which statement uses the word always?
    explanation: The lecture cautions that job protection has costs, and that even small nuisance tariffs can push firms to supply locally.

  - id: protect-numeric
    type: numeric
    skills: [protection-cost]
    difficulty: 2
    tags: [math]
    generator: protectQ
    lessonRef: { tab: math-code, id: protection-cost }
    prompt: |
      A tariff raises the price of a good by **{=risePerUnit} dollars** per unit. Buyers purchase **{=quantity|comma}** units a year, and the tariff protects **{=jobsProtected}** jobs. How much extra do buyers pay for each job protected?
    answer: { var: perJob, tol: 0.5 }
    misconceptions:
      - { var: wrongNoJobs, feedback: 'That is the total extra cost. Divide it by the number of jobs.' }
      - { var: wrongPerUnit, feedback: 'You divided the price rise by the jobs. First multiply the price rise by the units bought.' }
    hints:
      - First find what all buyers pay in total.
      - Multiply the price rise by the units, then divide by the jobs.
    explanation: |
      Buyers pay $ {=risePerUnit} \times {=quantity|comma} = {=buyersPay|comma}$ extra. Per job: $ {=buyersPay|comma} / {=jobsProtected} = {=perJob|comma}$.

  - id: protect-mcq
    type: mcq
    skills: [protection-cost]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: political-reasons }
    prompt: Why do protective tariffs often survive even when their total cost is high?
    options:
      - The gain is concentrated in a few groups while the cost is spread thinly across many buyers
      - The cost falls only on foreigners
      - Tariffs are free to collect
      - Consumers pay nothing
    answer: 0
    hints:
      - Who has a strong reason to lobby, and who barely notices?
    explanation: The sugar quota debate makes the point. A small group gains a lot while the many pay a little each.

  - id: protect-code
    type: code-fill
    skills: [protection-cost]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: protection-cost }
    prompt: Complete the cost of protection function.
    code: |
      def protection_cost(rise_per_unit, quantity, jobs_protected):
          buyers_pay = rise_per_unit * __BLANK_1__
          return buyers_pay / __BLANK_2__
    blanks:
      '1': { accept: ['quantity'] }
      '2': { accept: ['jobs_protected'] }
    hints:
      - Total cost first, then share it among the jobs.
    explanation: Total extra cost is the price rise times the units bought; dividing by jobs gives the cost per job.

  - id: motives-order
    type: order
    skills: [govt-role]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: political-reasons }
    prompt: Put a retaliation chain in a sensible order.
    items:
      - A country subsidizes its exporters
      - The subsidy lets them sell abroad cheaply
      - Foreign producers lose sales and ask their government to act
      - The importing government adds a countervailing duty
    hints:
      - Who acts first?
    explanation: The subsidy comes first; the importing country answers with a countervailing duty.

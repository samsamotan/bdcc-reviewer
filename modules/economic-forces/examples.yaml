examples:
  - id: basket-totals
    source: 'M7, slide 14: totals 1,865 baht and 160.05 dollars'
    fn: basketPPP
    in: { table: '@basket' }
    expect: { bahtTotal: 1865, usdTotal: 160.05 }
    tol: 0.005
  - id: basket-rate
    source: 'M7, slide 14: implied rate from the totals'
    fn: basketPPP
    in: { table: '@basket' }
    expect: { rate: 11.653, dearest: Rice (pound), cheapest: Dress }
    tol: 0.005
  - id: atlas-turkey
    source: 'M7, slide 15 (Table 7.2): Turkey'
    fn: atlasVsPpp
    in: { atlas: 10590, ppp: 36920 }
    expect: { ratio: 3.486, gap: 26330 }
    tol: 0.005
  - id: atlas-us
    source: 'M7, slide 15 (Table 7.2): United States'
    fn: atlasVsPpp
    in: { atlas: 76370, ppp: 77530 }
    expect: { ratio: 1.015, gap: 1160 }
    tol: 0.005
  - id: atlas-india
    source: 'M7, slide 16 (Table 7.2): India'
    fn: atlasVsPpp
    in: { atlas: 2380, ppp: 8210 }
    expect: { ratio: 3.45 }
    tol: 0.005
  - id: atlas-norway
    source: 'M7, slide 15 (Table 7.2): Norway'
    fn: atlasVsPpp
    in: { atlas: 95510, ppp: 118440 }
    expect: { ratio: 1.24 }
    tol: 0.005
  - id: group-norway
    source: 'M7, slide 8: over 13,845 is high income'
    fn: incomeGroup
    in: { perCapita: 95510 }
    expect: { label: High income }
  - id: group-malaysia
    source: 'M7, slides 8 and 16: Malaysia 11,780'
    fn: incomeGroup
    in: { perCapita: 11780 }
    expect: { label: Upper-middle income }
  - id: group-india
    source: 'M7, slides 8 and 16: India 2,380'
    fn: incomeGroup
    in: { perCapita: 2380 }
    expect: { label: Lower-middle income }
  - id: group-border-high
    source: 'M7, slide 8: 13,845 is not over 13,845'
    fn: incomeGroup
    in: { perCapita: 13845 }
    expect: { label: Upper-middle income }
  - id: group-border-lower
    source: 'M7, slide 8: lower-middle starts at 1,136'
    fn: incomeGroup
    in: { perCapita: 1136 }
    expect: { label: Lower-middle income }
  - id: group-low
    source: 'M7, slide 8: under 1,136 is low income'
    fn: incomeGroup
    in: { perCapita: 1000 }
    expect: { label: Low income }
  - id: gni-per-capita-example
    source: 'Beyond the slides: GNI per capita (slide 8)'
    fn: gniPerCapita
    in: { gni: 600, population: 40 }
    expect: { perCapita: 15000, group: High income }
    tol: 0.5
  - id: debt-china
    source: 'M7, slide 28 (Table 7.7): China 47,780%'
    fn: debtGrowth
    in: { table: '@debt', country: China }
    expect: { first: 5, last: 2389, pct: 47780 }
    tol: 1
  - id: debt-india
    source: 'M7, slide 28 (Table 7.7): India 2,938%'
    fn: debtGrowth
    in: { table: '@debt', country: India }
    expect: { pct: 2938 }
    tol: 1
  - id: debt-mexico
    source: 'M7, slide 28 (Table 7.7): Mexico 1,034%'
    fn: debtGrowth
    in: { table: '@debt', country: Mexico }
    expect: { pct: 1034 }
    tol: 1
  - id: debt-brazil
    source: 'M7, slide 28 (Table 7.7): Brazil 804%'
    fn: debtGrowth
    in: { table: '@debt', country: Brazil }
    expect: { pct: 804 }
    tol: 1
  - id: debt-turkey
    source: 'M7, slide 28 (Table 7.7): Turkey 2,416%'
    fn: debtGrowth
    in: { table: '@debt', country: Turkey }
    expect: { pct: 2416 }
    tol: 1
  - id: debt-indonesia
    source: 'M7, slide 28 (Table 7.7): Indonesia 1,886%'
    fn: debtGrowth
    in: { table: '@debt', country: Indonesia }
    expect: { pct: 1886 }
    tol: 1
  - id: debt-argentina
    source: 'M7, slide 28 (Table 7.7): Argentina 919%'
    fn: debtGrowth
    in: { table: '@debt', country: Argentina }
    expect: { pct: 919 }
    tol: 1
  - id: ulc-example
    source: 'M7, slide 23: total direct labor costs divided by units produced'
    fn: unitLaborCost
    in: { totalLabor: 50000, units: 10000 }
    expect: { ulc: 5 }
    tol: 0.005
  - id: discretionary-example
    source: 'M7, slide 22: disposable and discretionary income'
    fn: discretionary
    in: { income: 30000, tax: 4000, essentials: 12000 }
    expect: { disposable: 26000, discretionary: 14000 }
    tol: 0.5
  - id: density-example
    source: 'M7, slide 33: inhabitants per square kilometer'
    fn: populationDensity
    in: { population: 5000000, area: 100000 }
    expect: { density: 50 }
    tol: 0.005

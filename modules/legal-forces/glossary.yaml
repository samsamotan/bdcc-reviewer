terms:
  - id: legal-system
    term: Legal system
    aka: [legal systems]
    short: The set of laws, courts and ways of deciding disputes that a country uses.
    related: [civil-law, common-law, religious-law]
    skills: [legal-systems]
  - id: civil-law
    term: Civil law
    short: A system built on written codes that try to cover every area of life. Judges question witnesses to find the truth.
    long: It comes from ancient Roman law and is the most widespread system in the world. Its judges are inquisitorial.
    related: [common-law, religious-law]
    skills: [legal-systems]
  - id: common-law
    term: Common law
    short: A system that relies on earlier court decisions as well as written laws. The two sides argue before a judge or jury.
    related: [civil-law, precedent]
    skills: [legal-systems]
  - id: precedent
    term: Precedent
    aka: [precedents, case law]
    short: An earlier court decision that judges follow when they decide similar cases later.
    related: [common-law]
    skills: [legal-systems]
  - id: religious-law
    term: Religious law
    short: A system where a religious document or source is the basis of the law. Some forbid charging interest.
    related: [civil-law, common-law]
    skills: [legal-systems]
  - id: rule-of-law
    term: Rule of law
    short: The principle that everyone, including the government, must follow clear laws that are applied fairly.
    related: [corruption-perceptions-index, property-rights]
    skills: [corruption-index]
  - id: property-rights
    term: Property rights
    short: Legal rights to use something you own and to keep the income or benefits it produces.
    related: [rule-of-law]
    skills: [corruption-index]
  - id: bribery
    term: Bribery
    aka: [bribe, bribes]
    short: Paying money or gifts to an official to win special treatment.
    related: [foreign-corrupt-practices-act, corruption-perceptions-index]
    skills: [corruption-index]
  - id: corruption-perceptions-index
    term: Corruption Perceptions Index
    aka: [CPI]
    short: A yearly ranking of countries by how corrupt their public sector is seen to be. Rank 1 is the least corrupt.
    related: [bribery, rule-of-law]
    skills: [corruption-index]
  - id: foreign-corrupt-practices-act
    term: Foreign Corrupt Practices Act
    aka: [FCPA]
    short: A U.S. law that forbids paying foreign government officials to win business or special treatment.
    related: [bribery, facilitating-payment]
    skills: [corruption-index]
  - id: facilitating-payment
    term: Facilitating payment
    aka: [facilitating payments]
    short: A small payment to speed up a routine government service. The U.S. law allows it.
    related: [foreign-corrupt-practices-act, bribery]
    skills: [corruption-index]
  - id: international-law
    term: International law
    short: The set of rules that nations have agreed to follow in their dealings with one another.
    related: [public-international-law, private-international-law]
    skills: [intl-law]
  - id: public-international-law
    term: Public international law
    short: International rules that govern relationships between governments.
    related: [private-international-law]
    skills: [intl-law]
  - id: private-international-law
    term: Private international law
    short: International rules that govern relationships between people or companies in different countries.
    related: [public-international-law]
    skills: [intl-law]
  - id: treaty
    term: Treaty
    aka: [treaties, convention, protocol]
    short: A formal agreement between countries. It may also be called a convention, covenant, compact or protocol.
    related: [customary-international-law]
    skills: [intl-law]
  - id: customary-international-law
    term: Customary international law
    short: International rules that came from customs and common practice followed over centuries.
    related: [treaty]
    skills: [intl-law]
  - id: extraterritoriality
    term: Extraterritoriality
    aka: [extraterritorial application of laws]
    short: A country trying to apply its own laws to foreigners and to actions that take place outside its borders.
    related: [international-law]
    skills: [intl-law]
  - id: contract
    term: Contract
    aka: [contracts]
    short: A legally binding agreement between two or more parties to do something.
    related: [arbitration, choice-of-law]
    skills: [intl-law]
  - id: litigation
    term: Litigation
    short: A court case brought to decide and enforce legal rights. It can be slow and expensive.
    related: [arbitration, choice-of-forum]
    skills: [intl-law]
  - id: choice-of-law
    term: Choice-of-law provision
    aka: [choice-of-law]
    short: A clause in a contract that says which country's law will govern it.
    related: [choice-of-forum, contract]
    skills: [intl-law]
  - id: choice-of-forum
    term: Choice-of-forum clause
    aka: [choice-of-forum]
    short: A clause in a contract that says where a dispute will be settled.
    related: [choice-of-law, litigation]
    skills: [intl-law]
  - id: arbitration
    term: Arbitration
    short: Settling a dispute outside the courts, with a neutral decision maker. It is quicker, cheaper and more private.
    related: [litigation, cisg]
    skills: [intl-law]
  - id: cisg
    term: Convention on the International Sale of Goods
    aka: [CISG, UN Convention on the International Sale of Goods]
    short: A United Nations treaty with common rules for contracts to sell goods across borders, which reduces jurisdiction problems.
    related: [contract, treaty]
    skills: [intl-law]
  - id: incoterms
    term: Incoterms
    short: Standard trade terms from the International Chamber of Commerce that say who pays for what, and who carries the risk, when goods are shipped.
    related: [fas, fob, cfr, cif]
    skills: [incoterms]
  - id: fas
    term: FAS
    aka: [free alongside ship]
    short: The seller pays all costs up to the ship's side and clears the goods for export. Risk passes to the buyer there.
    related: [fob]
    skills: [incoterms]
  - id: fob
    term: FOB
    aka: [free on board]
    short: The seller delivers goods on board the ship at the port of shipment. Risk passes to the buyer once they are on board.
    related: [fas, cfr]
    skills: [incoterms]
  - id: cfr
    term: CFR
    aka: [cost and freight]
    short: The price includes the goods and the freight to the destination port. The buyer buys the insurance.
    related: [cif, fob]
    skills: [incoterms]
  - id: cif
    term: CIF
    aka: [cost insurance and freight]
    short: The price includes the goods, the insurance and all freight to the named destination port. Risk passes to the buyer on board.
    formula: '\text{CIF} = \text{FOB} + \text{freight} + \text{insurance}'
    related: [cfr, fob]
    skills: [incoterms]
  - id: intellectual-property
    term: Intellectual property
    aka: [IP]
    short: A creative work or invention that can be legally protected, such as by a patent, trademark or copyright.
    related: [patent, trademark, copyright]
    skills: [ip-rights]
  - id: patent
    term: Patent
    aka: [patents]
    short: A government grant giving an inventor the exclusive right to make, use and sell an invention for a time.
    related: [intellectual-property]
    skills: [ip-rights]
  - id: trademark
    term: Trademark
    aka: [trademarks]
    short: A shape, color, design, phrase or sound that a business uses to mark and set apart its products.
    related: [trade-name]
    skills: [ip-rights]
  - id: trade-name
    term: Trade name
    aka: [trade names]
    short: The name a business uses to mark and set apart its products, such as Pizza Hut for Yum! Brands.
    related: [trademark]
    skills: [ip-rights]
  - id: copyright
    term: Copyright
    aka: [copyrights]
    short: The exclusive legal right of authors, artists, composers and software makers to publish and sell their work.
    related: [intellectual-property]
    skills: [ip-rights]
  - id: trade-secret
    term: Trade secret
    aka: [trade secrets]
    short: Any information a business wants kept confidential, such as a formula or process. It needs no registration.
    related: [intellectual-property]
    skills: [ip-rights]
  - id: antitrust-law
    term: Antitrust law
    aka: [competition law, competition laws]
    short: Laws that stop firms from gaining too much market power or abusing it through price fixing, market sharing or monopolies.
    related: [tort]
    skills: [national-laws]
  - id: tort
    term: Tort
    aka: [torts]
    short: An injury done to another person, either on purpose or by carelessness, that the law lets them seek payment for.
    related: [strict-liability]
    skills: [national-laws]
  - id: strict-liability
    term: Strict liability
    short: A rule that makes the maker of a product liable for damage it causes, even if the injured person cannot prove carelessness.
    related: [tort]
    skills: [national-laws]
  - id: ifrs
    term: International Financial Reporting Standards
    aka: [IFRS, GAAP]
    short: The accounting rules used by the European Union and most other countries. The United States uses a different set called GAAP.
    related: [sarbanes-oxley]
    skills: [national-laws]
  - id: sarbanes-oxley
    term: Sarbanes-Oxley Act
    aka: [SOX]
    short: A U.S. law passed after accounting scandals that sets higher standards for boards, managers and auditors.
    related: [ifrs]
    skills: [national-laws]

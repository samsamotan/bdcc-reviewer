examples:
  - id: cpi-denmark
    source: 'M6, slide 32 (Table 6.4): Denmark 1999 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: Denmark, from: '1999', to: '2022' }
    expect: { earlier: 1, later: 1, change: 0, direction: unchanged }
    tol: 0.001
  - id: cpi-france
    source: 'M6, slide 32 (Table 6.4): France 1999 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: France, from: '1999', to: '2022' }
    expect: { earlier: 22, later: 21, change: 1, direction: improved }
    tol: 0.001
  - id: cpi-japan
    source: 'M6, slide 32 (Table 6.4): Japan 1999 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: Japan, from: '1999', to: '2022' }
    expect: { earlier: 25, later: 18, change: 7, direction: improved }
    tol: 0.001
  - id: cpi-china
    source: 'M6, slide 33 (Table 6.4): China 1999 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: China, from: '1999', to: '2022' }
    expect: { earlier: 58, later: 65, change: -7, direction: worsened }
    tol: 0.001
  - id: cpi-mexico
    source: 'M6, slide 33 (Table 6.4): Mexico 1999 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: Mexico, from: '1999', to: '2022' }
    expect: { earlier: 58, later: 120, change: -62, direction: worsened }
    tol: 0.001
  - id: cpi-canada
    source: 'M6, slide 32 (Table 6.4): Canada 1999 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: Canada, from: '1999', to: '2022' }
    expect: { earlier: 5, later: 14, change: -9 }
    tol: 0.001
  - id: cpi-nigeria
    source: 'M6, slide 33 (Table 6.4): Nigeria 2009 and 2022'
    fn: cpiRank
    in: { table: '@cpi', country: Nigeria, from: '2009', to: '2022' }
    expect: { earlier: 130, later: 150, change: -20 }
    tol: 0.001
  - id: cpi-best-2022
    source: 'M6, slide 32 (Table 6.4): best rank in 2022'
    fn: cpiBest
    in: { table: '@cpi', year: '2022' }
    expect: { country: Denmark, rank: 1 }
    tol: 0.001
  - id: cpi-best-2009
    source: 'M6, slide 32 (Table 6.4): best rank in 2009'
    fn: cpiBest
    in: { table: '@cpi', year: '2009' }
    expect: { country: New Zealand, rank: 1 }
    tol: 0.001
  - id: law-invention
    source: 'M6, slide 17: patents protect an invention'
    fn: whichLaw
    in: { issue: invention }
    expect: { law: Patent, area: intellectual property }
  - id: law-secret
    source: 'M6, slide 22: trade secrets protect confidential information'
    fn: whichLaw
    in: { issue: confidential-info }
    expect: { law: Trade secret }
  - id: law-price-fixing
    source: 'M6, slide 26: antitrust law prevents price fixing'
    fn: whichLaw
    in: { issue: price-fixing }
    expect: { law: Antitrust law, area: national law }
  - id: law-product-harm
    source: 'M6, slide 28: strict liability'
    fn: whichLaw
    in: { issue: product-harm }
    expect: { law: Strict liability }
  - id: law-scandal
    source: 'M6, slide 34: Sarbanes-Oxley followed worldwide scandals'
    fn: whichLaw
    in: { issue: accounting-scandal }
    expect: { law: Sarbanes-Oxley Act }
  - id: incoterm-fob
    source: 'Beyond the slides: FOB defined on slide 25'
    fn: incotermPrice
    in: { fob: 20000, freight: 2000, insurance: 300, loading: 500, term: FOB }
    expect: { price: 20000, buyerExtra: 2300, riskPassesAt: on board the ship }
    tol: 0.5
  - id: incoterm-fas
    source: 'Beyond the slides: FAS defined on slide 25'
    fn: incotermPrice
    in: { fob: 20000, freight: 2000, insurance: 300, loading: 500, term: FAS }
    expect: { price: 19500, buyerExtra: 2800, riskPassesAt: alongside the ship }
    tol: 0.5
  - id: incoterm-cfr
    source: 'Beyond the slides: CFR defined on slide 25'
    fn: incotermPrice
    in: { fob: 20000, freight: 2000, insurance: 300, loading: 500, term: CFR }
    expect: { price: 22000, buyerExtra: 300, includesInsurance: false }
    tol: 0.5
  - id: incoterm-cif
    source: 'Beyond the slides: CIF defined on slide 25'
    fn: incotermPrice
    in: { fob: 20000, freight: 2000, insurance: 300, loading: 500, term: CIF }
    expect: { price: 22300, buyerExtra: 0, includesInsurance: true }
    tol: 0.5

terms:
  - id: record-label
    term: Record label
    aka: [label, labels, record labels]
    short: A company that signs artists, makes and promotes their records, and usually owns the recordings.
    related: [major-label, independent-label]
    skills: [music-economics]
  - id: major-label
    term: Major label
    aka: [majors, major labels]
    short: One of the three big record companies, Universal, Sony and Warner, which together made over 80% of US recorded music sales.
    related: [independent-label]
    skills: [music-economics]
  - id: independent-label
    term: Independent label
    aka: [indie, indies, indie label]
    short: A smaller record company outside the three majors, often distributing through a major label for a fee.
    related: [major-label]
    skills: [music-economics]
  - id: physical-sales
    term: Physical sales
    short: Sales of music on a physical product such as a CD or vinyl record.
    related: [digital-download]
    skills: [music-economics]
  - id: digital-download
    term: Digital download
    aka: [download, downloads, digital downloads]
    short: Buying a song or album as a file that you own, such as from iTunes.
    related: [streaming, physical-sales]
    skills: [music-economics]
  - id: streaming
    term: Streaming
    short: Listening to music over the internet without owning the file.
    related: [digital-download, freemium]
    skills: [music-economics]
  - id: piracy
    term: Piracy
    short: Copying and sharing music without paying for it or asking the owner.
    related: [streaming]
    skills: [music-economics]
  - id: revenue
    term: Revenue
    aka: [revenues]
    short: The money a company takes in from selling its products or services before costs are taken out.
    related: [operating-result]
    skills: [growth-metrics]
  - id: operating-result
    term: Operating result
    aka: [operating loss, operating profit]
    short: Revenue minus the costs of running the business. A negative number is a loss.
    related: [revenue]
    skills: [growth-metrics]
  - id: percentage-change
    term: Percentage change
    aka: [percent change, growth rate]
    short: How much a number changed, as a share of where it started.
    formula: '\text{percent change} = \dfrac{\text{after} - \text{before}}{\text{before}}'
    related: [revenue]
    skills: [growth-metrics]
  - id: freemium
    term: Freemium
    aka: [free tier]
    short: A model that gives a basic version for free, with ads, and charges for a better version.
    related: [premium-subscription, ad-supported-streaming]
    skills: [business-model]
  - id: premium-subscription
    term: Premium subscription
    aka: [premium, paid subscription, subscription]
    short: A paid monthly plan that removes ads and adds features such as offline listening.
    related: [freemium, conversion-rate]
    skills: [business-model]
  - id: ad-supported-streaming
    term: Ad-supported streaming
    aka: [ad supported, advertising revenue]
    short: Free streaming paid for by ads that play between songs.
    related: [freemium]
    skills: [business-model]
  - id: conversion-rate
    term: Conversion rate
    short: The share of free users who become paying customers, or here the share of active users who pay.
    formula: '\text{conversion} = \dfrac{\text{paying}}{\text{active}}'
    related: [freemium, premium-subscription]
    skills: [business-model]
  - id: rights-holder
    term: Rights holder
    aka: [rights holders]
    short: The owner of a recording or song, such as a label or publisher, who is paid when it is played.
    related: [royalty, record-label]
    skills: [royalty-model]
  - id: revenue-sharing
    term: Revenue sharing
    short: Splitting income between the platform and the owners of the content, here about 70% to rights holders and 30% to Spotify.
    related: [rights-holder, per-stream-payout]
    skills: [royalty-model]
  - id: per-stream-payout
    term: Per-stream payout
    short: The small average amount paid to rights holders each time a song is played, between 0.006 and 0.008 dollars.
    related: [revenue-sharing]
    skills: [royalty-model, streams-vs-sales]
  - id: royalty
    term: Royalty
    aka: [royalties]
    short: A share of the money earned from a song or album that is paid to its creators or owners.
    related: [rights-holder, advance]
    skills: [royalty-model]
  - id: advance
    term: Advance
    aka: [advances]
    short: Money paid to an artist in advance, which the label recovers from royalties before paying more.
    related: [royalty]
    skills: [royalty-model]
  - id: windowing
    term: Windowing
    short: Keeping new music off some services for a period after release to push sales elsewhere first.
    related: [day-and-date-release]
    skills: [swift-takedown]
  - id: day-and-date-release
    term: Day-and-date release
    short: Releasing new music on every channel on the same day.
    related: [windowing]
    skills: [swift-takedown]
  - id: catalogue-takedown
    term: Catalogue takedown
    aka: [takedown]
    short: A request to remove an artist's whole library of music from a service.
    related: [windowing]
    skills: [swift-takedown]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>VAT along the chain</title>
  <link rel="stylesheet" href="../../kit/kit.css">
  <script src="../../kit/vendor/gsap.min.js"></script>
  <script src="../../kit/kit.js"></script>
</head>
<body>
  <!-- Monetary System · governments-step-in, beats 4–5 · 5 s. Segments: 0–2.6 stage 1 pays 12, stage 2 owes 18 less a 12 credit (no net: beat 4 asks for it), 2.6–5.0 stage 2 pays 6, stage 3 pays 12, total 30 = 12% of 250. -->
  <div id="stage" data-composition-id="vat-credit-chain" data-start="0" data-width="1280" data-height="720" data-duration="5"></div>
  <script>
    /*
     * Monetary System · governments-step-in (VAT), 5 s. Numbers are the scene's: 12%, prices 100 → 150 → 250.
     *   0.0–1.3  a supplier sells a crate at 100; a coral "12" coin drops into the government jar (counter 0 → 12)
     *   1.3–2.6  the crate moves to a factory that sells at 150: "12% of 150 = 18" and a teal "credit −12" voucher. Pause.
     *   2.6–3.3  the factory's "6" coin drops in (counter 12 → 18)
     *   3.3–4.2  the crate moves to a shop that sells at 250: "30 − 18 credit"; a "12" coin drops in (counter 18 → 30)
     *   4.2–5.0  "12 + 6 + 12 = 30 = 12% of 250"; hold
     */
    (() => {
      const { C } = HF;
      const tl = HF.timeline(5);
      window.__timelines['vat-credit-chain'] = tl;
      const ground = HF.layer('ground');
      const back = HF.layer('back');
      const mid = HF.layer('mid');
      const front = HF.layer('front');
      const G = 430;
      HF.box(ground, { x: -100, y: G, w: 1480, h: 400, r: 0, color: '#22356E', hi: false, shadeK: 0.04 });
      HF.el('rect', { x: -100, y: G, width: 1480, height: 6, fill: '#3A4F92' }, ground);

      const SX = [230, 640, 1050];
      const NAMES = ['Supplier', 'Factory', 'Shop'];
      const COLS = [C.teal, C.gold, C.coral];
      const actors = SX.map((x, i) => {
        const a = HF.g(mid, { transform: `translate(${x} ${G})` });
        const inner = HF.g(a);
        HF.box(inner, { x: -80, y: -100, w: 160, h: 100, r: 16, color: HF.shade(COLS[i], 0.05), shadeSide: 'right' });
        HF.el('path', { d: 'M-92 -96 L0 -150 L92 -96 Z', fill: COLS[i] }, inner);
        HF.box(inner, { x: -24, y: -60, w: 48, h: 60, r: 10, color: '#13254B', hi: false });
        HF.text(a, NAMES[i], { x: 0, y: 34, size: 22, color: COLS[i], weight: 900 });
        gsap.set(a, { opacity: 0 });
        gsap.set(inner, { scale: 0, transformOrigin: '50% 100%' });
        return { a, inner };
      });
      const sells = [100, 150, 250].map((p, i) => HF.label(`Sells at <span class="hf-num">${p}</span>`, { x: SX[i], y: G - 190, cls: 'sm pill', html: true }));

      const crate = HF.g(front);
      HF.box(crate, { x: -28, y: -40, w: 56, h: 40, r: 9, color: '#C9A06A' });
      HF.el('rect', { x: -4, y: -36, width: 8, height: 32, rx: 4, fill: '#A88350' }, crate);
      gsap.set(crate, { x: SX[0] + 110, y: G, opacity: 0 });

      // the government jar
      const JX = 640, JY = 640;
      const jar = HF.g(back, { transform: `translate(${JX} ${JY})` });
      const jarIn = HF.g(jar);
      HF.box(jarIn, { x: -120, y: -110, w: 240, h: 110, r: 26, color: C.violet });
      HF.box(jarIn, { x: -90, y: -128, w: 180, h: 24, r: 10, color: HF.shade(C.violet, 0.1) });
      gsap.set(jarIn, { scale: 0, transformOrigin: '50% 100%' });
      const counter = HF.label('Government <span class="hf-num">0</span>', { x: JX, y: JY - 56, cls: '', html: true });
      const cNum = counter.querySelector('.hf-num');

      const coin = (txt) => { const g = HF.g(front); HF.coin(g, { r: 26, color: C.coral, mark: txt }); gsap.set(g, { opacity: 0 }); return g; };
      const c1 = coin('12'), c2 = coin('6'), c3 = coin('12');
      const gross2 = HF.label('12% of 150 = <span class="hf-coral">18</span>', { x: SX[1], y: G - 250, cls: 'sm', html: true });
      const credit2 = HF.label('credit <span class="hf-teal">−12</span>', { x: SX[1] + 170, y: G - 120, cls: 'sm pill', html: true });
      const gross3 = HF.label('12% of 250 = <span class="hf-coral">30</span>', { x: SX[2], y: G - 250, cls: 'sm', html: true });
      const credit3 = HF.label('credit <span class="hf-teal">−18</span>', { x: SX[2] - 170, y: G - 120, cls: 'sm pill', html: true });
      const total = HF.label('12 + 6 + 12 = <span class="hf-gold">30</span> = 12% of 250', { x: 640, y: 120, cls: 'lg', hud: true, html: true });

      const L = (t) => HF.label(t, { x: 640, y: 76, cls: 'lg', hud: true, html: true });
      const l1 = L('Stage 1 · 12% of 100 = <span class="hf-coral">12</span>');
      const l2 = L('Stage 2 · owes 18, minus the 12 already paid');
      const l3 = L('Each stage pays only on the value it adds');

      const drop = (c, x, at) => {
        tl.set(c, { opacity: 1 }, at);
        HF.arc(tl, c, { x0: x, y0: G - 120, x1: JX, y1: JY - 130, h: 80 }, at, 0.4, { spin: 0 });
        tl.to(c, { scale: 0, duration: 0.1, transformOrigin: '50% 50%' }, at + 0.4);
        HF.land(tl, jarIn, at + 0.4, { amount: 0.08, origin: '50% 100%' });
      };

      // ================================================================ choreography
      // 0.0–1.3 stage 1
      tl.to(actors.map((a) => a.a), { opacity: 1, duration: 0.01 }, 0);
      HF.pop(tl, actors.map((a) => a.inner), 0.0, { origin: '50% 100%', stagger: 0.06 });
      HF.pop(tl, jarIn, 0.15, { origin: '50% 100%' });
      HF.pop(tl, counter, 0.25);
      HF.say(tl, l1, 0.3, 1.3);
      tl.to(crate, { opacity: 1, duration: 0.12 }, 0.35);
      HF.pop(tl, sells[0], 0.4);
      drop(c1, SX[0], 0.6);
      HF.count(cNum, 0, 12, 1.0, 0.2, { format: (v) => String(Math.round(v)) });

      // 1.3–2.6 stage 2 (gross and credit; no net)
      HF.say(tl, l2, 1.35, 2.6);
      HF.arc(tl, crate, { x0: SX[0] + 110, y0: G, x1: SX[1] + 110, y1: G, h: 90 }, 1.35, 0.4);
      HF.pop(tl, sells[1], 1.7);
      HF.pop(tl, gross2, 1.85);
      HF.pop(tl, credit2, 2.05);
      HF.wobble(tl, credit2, 2.3, { amount: 4, dur: 0.22 });

      // 2.6–3.3 stage 2 pays the difference
      HF.say(tl, l3, 2.65);
      drop(c2, SX[1], 2.65);
      HF.count(cNum, 12, 18, 3.05, 0.2, { format: (v) => String(Math.round(v)) });
      tl.to([gross2, credit2], { scale: 0, duration: 0.15 }, 3.05);

      // 3.3–4.2 stage 3
      HF.arc(tl, crate, { x0: SX[1] + 110, y0: G, x1: SX[2] - 110, y1: G, h: 90 }, 3.2, 0.4);
      HF.pop(tl, sells[2], 3.5);
      HF.pop(tl, gross3, 3.55);
      HF.pop(tl, credit3, 3.65);
      drop(c3, SX[2], 3.75);
      HF.count(cNum, 18, 30, 4.15, 0.2, { format: (v) => String(Math.round(v)) });

      // 4.2–5.0 the total
      tl.to(l3, { scale: 0, duration: 0.12 }, 4.2);
      HF.pop(tl, total, 4.3);
    })();
  </script>
  <script type="module" src="../../kit/kit-three.js"></script>
</body>
</html>

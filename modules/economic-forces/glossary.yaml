terms:
  - id: foreign-environment
    term: Foreign environment
    short: All the forces outside the home country that a company cannot control but that surround and affect it.
    related: [international-environment]
    skills: [economy-size]
  - id: international-environment
    term: International environment
    short: The way forces at home and forces abroad act on each other, and the way forces in two countries interact.
    related: [foreign-environment]
    skills: [economy-size]
  - id: gdp
    term: Gross domestic product
    aka: [GDP]
    short: The total money value of all goods and services made inside a country in one year.
    related: [gni]
    skills: [economy-size]
  - id: gni
    term: Gross national income
    aka: [GNI]
    short: The total income earned by a nation's residents, including income from abroad as well as from production at home.
    formula: '\text{GNI per capita} = \dfrac{\text{GNI}}{\text{population}}'
    related: [gdp, gni-per-capita]
    skills: [economy-size]
  - id: gni-per-capita
    term: GNI per capita
    aka: [income per person]
    short: A country's gross national income divided by its population, a rough sign of how advanced its economy is.
    related: [gni]
    skills: [economy-size, development-level]
  - id: economic-growth-rate
    term: Economic growth rate
    aka: [growth rate]
    short: How fast a country's output or income is rising, which shows whether demand from its consumers is expanding.
    related: [gni]
    skills: [economy-size]
  - id: underground-economy
    term: Underground economy
    aka: [shadow economy, informal economy]
    short: Income that official statistics miss because it is unreported or underreported, including barter and illegal trade.
    related: [gdp]
    skills: [economy-size]
  - id: developed-economy
    term: Developed economy
    aka: [developed economies]
    short: A high-income industrial country with high living standards and the most advanced infrastructure.
    related: [developing-economy]
    skills: [development-level]
  - id: developing-economy
    term: Developing economy
    aka: [developing economies]
    short: A lower-income country with less advanced infrastructure and lower living standards.
    related: [developed-economy, emerging-market-economy]
    skills: [development-level]
  - id: emerging-market-economy
    term: Emerging market economy
    aka: [emerging market, emerging markets]
    short: A country with low to middle incomes per person that is moving toward developed status, such as India and China.
    related: [developing-economy]
    skills: [development-level]
  - id: exchange-rate
    term: Exchange rate
    short: The price of one currency in another currency, used to convert money from one country into another.
    related: [purchasing-power-parity]
    skills: [ppp]
  - id: inflation
    term: Inflation
    short: A sustained rise in the general level of prices, so each unit of money buys less than before.
    related: [atlas-conversion-factor]
    skills: [ppp]
  - id: purchasing-power-parity
    term: Purchasing power parity
    aka: [PPP]
    short: A way of adjusting exchange rates so that two currencies buy the same amount of goods.
    formula: '\text{implied rate} = \dfrac{\text{basket cost at home}}{\text{basket cost abroad}}'
    related: [exchange-rate, atlas-conversion-factor]
    skills: [ppp]
  - id: atlas-conversion-factor
    term: Atlas conversion factor
    aka: [Atlas method]
    short: The World Bank's exchange rate for comparing incomes, averaged over three years and adjusted for inflation to smooth out swings.
    related: [purchasing-power-parity]
    skills: [ppp]
  - id: income-distribution
    term: Income distribution
    short: How a nation's income is shared out among its people.
    related: [gini-index]
    skills: [inequality-spending]
  - id: gini-index
    term: Gini index
    aka: [GINI index, Gini]
    short: A measure of how equally family income is shared in a country. A higher value means less equality.
    related: [income-distribution]
    skills: [inequality-spending]
  - id: disposable-income
    term: Disposable income
    short: Personal income left after paying taxes.
    formula: '\text{disposable} = \text{income} - \text{taxes}'
    related: [discretionary-income]
    skills: [inequality-spending]
  - id: discretionary-income
    term: Discretionary income
    short: The income left after paying taxes and making essential purchases, which can be spent on choice items.
    formula: '\text{discretionary} = \text{disposable} - \text{essentials}'
    related: [disposable-income]
    skills: [inequality-spending]
  - id: unit-labor-cost
    term: Unit labor cost
    short: The total direct labor cost divided by the number of units produced.
    formula: '\text{ULC} = \dfrac{\text{total direct labor cost}}{\text{units produced}}'
    related: [exchange-rate]
    skills: [labor-costs]
  - id: external-debt
    term: External debt
    aka: [foreign debt, external stock of debt]
    short: Money a country owes to lenders abroad. Large amounts can limit its access to foreign currency.
    related: [exchange-rate]
    skills: [external-debt]
  - id: population-density
    term: Population density
    short: The number of inhabitants per square kilometer or square mile.
    formula: '\text{density} = \dfrac{\text{population}}{\text{area}}'
    related: [rural-to-urban-shift]
    skills: [population]
  - id: age-distribution
    term: Age distribution
    short: How a population divides into age groups, such as the young, the working-age and the elderly.
    related: [population-density]
    skills: [population]
  - id: rural-to-urban-shift
    term: Rural-to-urban shift
    short: The movement of a nation's people from the countryside to cities.
    related: [population-density]
    skills: [population]

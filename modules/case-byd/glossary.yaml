terms:
  - id: electric-vehicle
    term: Electric vehicle
    aka: [EV, EVs, electric vehicles]
    short: A car that runs on electricity stored in a battery instead of burning fuel.
    related: [plug-in-hybrid, internal-combustion-engine]
    skills: [byd-market]
  - id: plug-in-hybrid
    term: Plug-in hybrid
    aka: [hybrid, hybrids]
    short: A car with both a battery that can be charged from the grid and a fuel engine.
    related: [electric-vehicle, internal-combustion-engine]
    skills: [byd-market]
  - id: internal-combustion-engine
    term: Internal combustion engine
    aka: [ICE]
    short: A traditional car engine that burns fuel such as petrol or diesel.
    related: [electric-vehicle]
    skills: [byd-market]
  - id: market-share
    term: Market share
    short: The part of all sales in a market that goes to one company, shown as a percentage.
    formula: '\text{market share} = \dfrac{\text{company sales}}{\text{total sales}}'
    related: [price-war]
    skills: [byd-market]
  - id: late-mover-advantage
    term: Late-mover advantage
    short: A benefit that comes from starting later, because you can build new systems without being held back by older ones.
    related: [ecosystem]
    skills: [byd-market]
  - id: ecosystem
    term: Ecosystem
    short: A network of partners, suppliers and services around a company that work together and support one another.
    related: [vertical-integration, late-mover-advantage]
    skills: [byd-market]
  - id: price-war
    term: Price war
    short: A fight between rivals in which each keeps cutting prices to win customers, squeezing everyone's profit.
    related: [market-share]
    skills: [byd-market]
  - id: lfp-battery
    term: LFP battery
    aka: [lithium iron phosphate, LFP]
    short: A lithium iron phosphate battery. It is cheaper and safer than other types but stores less energy for its size.
    related: [nmc-battery]
    skills: [cost-advantage]
  - id: nmc-battery
    term: NMC battery
    aka: [NMC, nickel manganese cobalt]
    short: A battery made with nickel, manganese and cobalt. It stores more energy but costs more.
    related: [lfp-battery]
    skills: [cost-advantage]
  - id: vertical-integration
    term: Vertical integration
    short: A company making many of the parts and inputs for its products itself instead of buying them from suppliers.
    related: [supplier-margin, ecosystem]
    skills: [cost-advantage]
  - id: supplier-margin
    term: Supplier margin
    short: The profit a supplier adds to the price of a part it sells to a carmaker.
    related: [vertical-integration]
    skills: [cost-advantage]
  - id: cost-advantage
    term: Cost advantage
    short: Being able to make the same product for less than rivals, shown as the gap in cost per unit.
    formula: '\text{cost advantage} = \text{rival cost} - \text{own cost}'
    related: [vertical-integration]
    skills: [cost-advantage]
  - id: compound-annual-growth-rate
    term: Compound annual growth rate
    aka: [CAGR, yearly growth rate]
    short: The steady yearly rate of growth that would take a number from its starting value to its ending value.
    formula: '\text{CAGR} = \left(\dfrac{\text{end}}{\text{start}}\right)^{1/n} - 1'
    related: [break-even-volume]
    skills: [scale-growth]
  - id: break-even-volume
    term: Break-even volume
    short: The number of units a company must sell for its income to cover its costs.
    related: [compound-annual-growth-rate]
    skills: [scale-growth]
  - id: ckd-assembly
    term: CKD assembly
    aka: [completely knocked down, CKD]
    short: Putting together cars at a local plant from parts that were made elsewhere and shipped in.
    related: [joint-venture]
    skills: [overseas-push]
  - id: joint-venture
    term: Joint venture
    aka: [JV, JVs, joint ventures]
    short: A business owned and run together by two or more companies.
    related: [ckd-assembly]
    skills: [overseas-push]
  - id: tariff
    term: Tariff
    aka: [tariffs]
    short: A tax on imported goods that raises their price in the country that charges it.
    formula: '\text{price after tariff} = \text{price} \times (1 + \text{tariff rate})'
    related: [subsidy]
    skills: [trade-policy]
  - id: subsidy
    term: Subsidy
    aka: [subsidies]
    short: Money or other help from a government that lowers a company's costs or boosts its sales.
    related: [tariff]
    skills: [subsidy-role]

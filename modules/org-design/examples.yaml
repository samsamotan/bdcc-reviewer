examples:
  - id: transfer-table-10-2
    source: 'M10, slide 34 (Table 10.2): Alpha 60 / Beta 40'
    fn: transferPricing
    in: { alphaPretax: 60, betaPretax: 40, alphaRate: 0.5, betaRate: 0.2 }
    expect: { alphaTax: 30, alphaAfter: 30, betaTax: 8, betaAfter: 32, totalAfter: 62 }
    tol: 0.005
  - id: transfer-table-10-3
    source: 'M10, slide 35 (Table 10.3): Alpha 40 / Beta 60'
    fn: transferPricing
    in: { alphaPretax: 40, betaPretax: 60, alphaRate: 0.5, betaRate: 0.2 }
    expect: { alphaTax: 20, alphaAfter: 20, betaTax: 12, betaAfter: 48, totalAfter: 68 }
    tol: 0.005
  - id: transfer-total-tax
    source: 'M10, slides 34-35: total tax falls from 38 to 32'
    fn: transferPricing
    in: { alphaPretax: 40, betaPretax: 60, alphaRate: 0.5, betaRate: 0.2 }
    expect: { totalTax: 32, totalPretax: 100 }
    tol: 0.005
  - id: transfer-gain
    source: 'M10, slides 34-35: moving 20 of profit gains 6'
    fn: shiftGain
    in: { shift: 20, highRate: 0.5, lowRate: 0.2 }
    expect: { gain: 6 }
    tol: 0.005
  - id: hierarchy-three
    source: 'Beyond the slides: span of control and hierarchy (slide 6)'
    fn: hierarchyLevels
    in: { employees: 1000, span: 10 }
    expect: { layers: 3, managers: 111 }
  - id: hierarchy-two
    source: 'Beyond the slides: span of control and hierarchy (slide 6)'
    fn: hierarchyLevels
    in: { employees: 100, span: 10 }
    expect: { layers: 2, managers: 11 }
  - id: central-example
    source: 'Beyond the slides: level of centralization (slide 6)'
    fn: centralization
    in: { hq: 30, total: 50 }
    expect: { share: 0.6, local: 20, label: mostly centralized }
    tol: 0.005
  - id: culture-home
    source: 'M10, slide 25: home replication leads to an ethnocentric culture'
    fn: cultureFor
    in: { strategy: home replication }
    expect: { culture: Ethnocentric }
  - id: culture-multidomestic
    source: 'M10, slide 25: multidomestic leads to a polycentric culture'
    fn: cultureFor
    in: { strategy: multidomestic }
    expect: { culture: Polycentric }
  - id: culture-transnational
    source: 'M10, slide 25: transnational leads to a geocentric culture'
    fn: cultureFor
    in: { strategy: transnational }
    expect: { culture: Geocentric }
  - id: structure-product
    source: 'M10, slide 11: product structure avoids duplication of product experts'
    fn: structureInfo
    in: { structure: product }
    expect: { strength: Avoids duplicating product experts, weakness: Duplicates area experts }
  - id: structure-geographic
    source: 'M10, slide 13: geographic region structure'
    fn: structureInfo
    in: { structure: geographic }
    expect: { strength: Every country is under someone in contact with headquarters }
  - id: structure-functional
    source: 'M10, slide 15: functional structure suits oil companies'
    fn: structureInfo
    in: { structure: functional }
    expect: { strength: 'Suits a narrow, highly integrated product mix such as oil' }
  - id: ownership-majority
    source: 'M10, slide 26: subsidiaries are controlled through majority voting stock'
    fn: ownershipControl
    in: { sharePct: 60 }
    expect: { type: Subsidiary, majority: true }
  - id: ownership-minority
    source: 'M10, slides 26 and 38: affiliates and ways to keep control'
    fn: ownershipControl
    in: { sharePct: 40 }
    expect: { type: Affiliate, majority: false }

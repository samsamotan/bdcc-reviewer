terms:
  - id: currency
    term: Currency
    aka: [currencies, money]
    short: The money a country issues and uses, such as the peso, the dollar or the euro.
    related: [exchange-rate, central-bank]
    skills: [monetary-system]
  - id: exchange-rate
    term: Exchange rate
    aka: [exchange rates, FX rate]
    short: The price of one currency measured in another currency, for example 1.10 dollars for one euro.
    related: [currency, spot-rate]
    skills: [monetary-system, fx-quotes]
  - id: central-bank
    term: Central bank
    aka: [central banks]
    short: A country's official bank for money. It issues the currency, runs interest rates and holds the nation's reserves.
    related: [reserves, currency]
    skills: [monetary-system]
  - id: gold-standard
    term: Gold standard
    short: A money system where each unit of currency is worth a fixed amount of gold.
    long: Britain set this up in 1717 under Sir Isaac Newton. Governments cannot print extra money freely, so they have little monetary flexibility.
    related: [bretton-woods, fixed-exchange-rate]
    skills: [monetary-system]
  - id: fixed-exchange-rate
    term: Fixed exchange rate
    aka: [fixed rate, fixed rates, peg]
    short: A rate where a currency's value is tied to gold or to another currency and the government defends it.
    related: [par-value, floating-exchange-rate]
    skills: [monetary-system]
  - id: bretton-woods
    term: Bretton Woods system
    aka: [Bretton Woods]
    short: The money system used from 1945 to 1971 in which currencies had fixed values linked to gold and the U.S. dollar.
    related: [par-value, triffin-paradox]
    skills: [monetary-system]
  - id: par-value
    term: Par value
    short: The official value of a currency stated in gold, or in dollars, under a fixed system.
    related: [bretton-woods, fixed-exchange-rate]
    skills: [monetary-system]
  - id: reserves
    term: Reserves
    aka: [reserve assets, central reserves]
    short: Assets such as gold and foreign currency held by a central bank to back the government's debts and defend its currency.
    related: [central-bank, triffin-paradox, official-reserves]
    skills: [monetary-system]
  - id: triffin-paradox
    term: Triffin paradox
    short: A currency that the world holds as a reserve must run deficits to supply it, which in time weakens trust in that currency.
    related: [reserves, bretton-woods]
    skills: [monetary-system]
  - id: floating-exchange-rate
    term: Floating exchange rate
    aka: [floating rate, floating rates, floating]
    short: A rate set freely by supply and demand in the market, with no promise from the government to hold it.
    related: [fixed-exchange-rate, fx-market]
    skills: [monetary-system]
  - id: hard-peg
    term: Hard peg
    aka: [hard pegs]
    short: The strictest fixed arrangement, where a country uses another currency outright or a currency board backs every unit of its money.
    related: [soft-peg, fixed-exchange-rate]
    skills: [monetary-system]
  - id: soft-peg
    term: Soft peg
    aka: [soft pegs]
    short: A looser fixed arrangement where the rate may drift slowly or move inside a band, such as a conventional peg or crawling peg.
    related: [hard-peg, fixed-exchange-rate]
    skills: [monetary-system]
  - id: fiat-currency
    term: Fiat currency
    aka: [fiat, flat currency]
    short: Money issued by a government and not backed by gold or silver. It has value because people accept it and the law requires it.
    related: [cbdc, currency]
    skills: [monetary-system]
  - id: cryptocurrency
    term: Cryptocurrency
    aka: [cryptocurrencies, crypto]
    short: Digital money secured by code, run by a network instead of a central authority. Bitcoin and Ethereum are examples.
    related: [stablecoin, cbdc]
    skills: [monetary-system]
  - id: stablecoin
    term: Stablecoin
    aka: [stablecoins]
    short: A digital coin built to keep a steady value by pegging to a fiat currency, a metal or another cryptocurrency.
    long: Algorithmic stablecoins have no physical backing and rely on computer rules to control supply.
    related: [cryptocurrency, fiat-currency]
    skills: [monetary-system]
  - id: cbdc
    term: Central bank digital currency
    aka: [CBDC, CBDCs]
    short: A digital form of a country's official money, issued and controlled by its central bank.
    related: [fiat-currency, central-bank]
    skills: [monetary-system]
  - id: fx-market
    term: Foreign exchange market
    aka: [FX market, FX, forex]
    short: The worldwide market, run by banks over computer links rather than in one place, where currencies are bought and sold.
    related: [exchange-rate, spot-rate]
    skills: [fx-quotes]
  - id: spot-rate
    term: Spot rate
    aka: [spot, spot exchange rate]
    short: The exchange rate for a trade settled within two business days.
    related: [forward-rate, exchange-rate]
    skills: [fx-quotes]
  - id: bid-price
    term: Bid price
    aka: [bid]
    short: The highest price a buyer is currently offering for a currency. It is the price at which a dealer buys from you.
    related: [ask-price, bid-ask-spread]
    skills: [fx-quotes]
  - id: ask-price
    term: Ask price
    aka: [ask, offer]
    short: The lowest price a seller is currently asking for a currency. It is the price at which a dealer sells to you.
    related: [bid-price, bid-ask-spread]
    skills: [fx-quotes]
  - id: bid-ask-spread
    term: Bid-ask spread
    aka: [spread]
    short: The gap between the ask price and the bid price. It is the dealer's built-in fee for making the trade.
    formula: '\text{spread} = \text{ask} - \text{bid}'
    related: [bid-price, ask-price]
    skills: [fx-quotes]
  - id: reciprocal-quote
    term: Reciprocal quote
    aka: [reciprocal, reverse quote]
    short: The same exchange rate stated the other way round, so one currency's price becomes the other's. Divide 1 by the rate.
    formula: '\text{USD/EUR} = \dfrac{1}{\text{EUR/USD}}'
    related: [exchange-rate, cross-rate]
    skills: [fx-quotes]
  - id: cross-rate
    term: Cross rate
    aka: [cross rates]
    short: An exchange rate between two currencies worked out from each one's rate against a third currency, usually the dollar.
    formula: '\text{EUR/GBP} = \text{EUR/USD} \times \text{USD/GBP}'
    related: [reciprocal-quote, exchange-rate]
    skills: [cross-rates]
  - id: law-of-one-price
    term: Law of one price
    short: In an efficient market, the same product should sell for the same price everywhere once prices are measured in one currency.
    related: [arbitrage, purchasing-power-parity]
    skills: [ppp]
  - id: arbitrage
    term: Arbitrage
    short: Buying something in one market and selling it in another at the same moment to earn a profit with no risk.
    related: [law-of-one-price, covered-interest-parity]
    skills: [ppp]
  - id: inflation
    term: Inflation
    aka: [inflation rate]
    short: A sustained rise in the general level of prices, so each unit of money buys less than before.
    related: [real-interest-rate, purchasing-power-parity]
    skills: [ppp, fisher]
  - id: purchasing-power-parity
    term: Purchasing power parity
    aka: [PPP]
    short: The idea that exchange rates adjust so that the same money buys the same goods in either country.
    formula: '\text{expected rate} \approx \text{spot} \times (1 + \pi_{\text{home}} - \pi_{\text{foreign}})'
    related: [law-of-one-price, inflation]
    skills: [ppp]
  - id: nominal-interest-rate
    term: Nominal interest rate
    aka: [nominal rate, nominal interest]
    short: The interest rate quoted on a loan or deposit, before taking price rises into account.
    related: [real-interest-rate, fisher-effect]
    skills: [fisher]
  - id: real-interest-rate
    term: Real interest rate
    aka: [real rate]
    short: The interest rate after removing the effect of price rises. It shows how much buying power the lender really gains.
    formula: 'r = i - \pi^{e}'
    related: [nominal-interest-rate, inflation, fisher-effect]
    skills: [fisher]
  - id: fisher-effect
    term: Fisher effect
    short: The link between the two interest rates. The real rate equals the nominal rate minus the inflation people expect.
    formula: 'r = i - \pi^{e}'
    related: [real-interest-rate, international-fisher-effect]
    skills: [fisher]
  - id: forward-rate
    term: Forward rate
    aka: [forward, forward exchange rate]
    short: A price agreed today for swapping currencies on a fixed future date, often 30, 60, 90 or 180 days away.
    formula: 'F = S \times (1 + i_{\text{home}} - i_{\text{foreign}})'
    related: [spot-rate, covered-interest-parity]
    skills: [forward-parity]
  - id: covered-interest-parity
    term: Covered interest rate parity
    aka: [covered interest parity, interest rate parity, CIRP]
    short: The rule that the percentage gap between the forward and spot rates equals the gap between the two countries' interest rates.
    formula: '\dfrac{F - S}{S} = i_{\text{home}} - i_{\text{foreign}}'
    related: [forward-rate, arbitrage]
    skills: [forward-parity]
  - id: international-fisher-effect
    term: International Fisher effect
    short: The idea that the gap between two countries' interest rates predicts how their exchange rate will change.
    related: [fisher-effect, covered-interest-parity]
    skills: [forward-parity, fisher]
  - id: efficient-market
    term: Efficient market approach
    aka: [efficient market, efficient markets]
    short: The view that today's market prices already reflect everything relevant that is known, so no one can predict an easy gain.
    related: [random-walk]
    skills: [forecasting]
  - id: random-walk
    term: Random walk hypothesis
    aka: [random walk]
    short: The view that rate changes cannot be predicted, so the best guess for tomorrow's price is simply today's price.
    formula: '\hat{S}_{t+1} = S_t'
    related: [efficient-market, technical-analysis]
    skills: [forecasting]
  - id: fundamental-approach
    term: Fundamental approach
    aka: [fundamental analysis]
    short: Forecasting rates with models of the economy, such as inflation, interest rates and trade, and how they relate.
    related: [technical-analysis]
    skills: [forecasting]
  - id: technical-analysis
    term: Technical analysis
    aka: [chartist, charting]
    short: Forecasting by studying past prices for trends and then projecting those trends forward.
    related: [fundamental-approach, random-walk]
    skills: [forecasting]
  - id: exchange-controls
    term: Currency exchange controls
    aka: [exchange controls, currency controls]
    short: Government limits on who may buy, sell or hold foreign currency, usually to protect the country's reserves.
    related: [convertible-currency, reserves]
    skills: [govt-forces]
  - id: convertible-currency
    term: Convertible currency
    aka: [convertible, nonconvertible currency]
    short: A currency that can be swapped for other currencies without restrictions. A nonconvertible one cannot.
    related: [exchange-controls]
    skills: [govt-forces]
  - id: income-tax
    term: Income tax
    short: A direct tax on the income that people and companies earn.
    related: [value-added-tax, withholding-tax]
    skills: [govt-forces]
  - id: value-added-tax
    term: Value-added tax
    aka: [VAT]
    short: A sales tax collected at every step of production on the value added at that step. Earlier tax payments are credited back.
    formula: '\text{tax paid} = t \times \text{price} - t \times \text{input price}'
    related: [income-tax, withholding-tax]
    skills: [govt-forces]
  - id: withholding-tax
    term: Withholding tax
    short: A tax taken at the source from passive income such as interest, dividends or royalties paid to another country.
    related: [income-tax, value-added-tax]
    skills: [govt-forces]
  - id: balance-of-payments
    term: Balance of payments
    aka: [BOP]
    short: A record of all of a country's money dealings with the rest of the world over a period.
    related: [current-account, capital-account, official-reserves]
    skills: [bop]
  - id: current-account
    term: Current account
    short: The part of the balance of payments that records trade in goods and services and other money sent across borders, such as aid.
    related: [capital-account, balance-of-payments]
    skills: [bop]
  - id: capital-account
    term: Capital account
    short: The part of the balance of payments that records investments and loans moving across borders.
    related: [current-account, balance-of-payments]
    skills: [bop]
  - id: official-reserves
    term: Official reserves
    short: The part of the balance of payments that records changes in the central bank's gold and foreign currency holdings.
    related: [reserves, balance-of-payments]
    skills: [bop]

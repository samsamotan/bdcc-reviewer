examples:
  - id: formats-2010
    source: 'Spotify case, Exhibit 2a: 2010'
    fn: formatShares
    in: { table: '@usformats', year: '2010' }
    expect: { physical: 3392, downloads: 2208, streaming: 461, total: 6061, share: 0.0761 }
    tol: 0.001
  - id: formats-2011
    source: 'Spotify case, Exhibit 2a: 2011'
    fn: formatShares
    in: { table: '@usformats', year: '2011' }
    expect: { total: 6238, streaming: 540, share: 0.0866 }
    tol: 0.001
  - id: formats-2012
    source: 'Spotify case, Exhibit 2a: 2012'
    fn: formatShares
    in: { table: '@usformats', year: '2012' }
    expect: { total: 6180, streaming: 862, share: 0.1395 }
    tol: 0.001
  - id: formats-2013
    source: 'Spotify case, Exhibit 2a: 2013'
    fn: formatShares
    in: { table: '@usformats', year: '2013' }
    expect: { physical: 2126, downloads: 2800, streaming: 1283, total: 6209, share: 0.2066 }
    tol: 0.001
  - id: revenue-growth
    source: 'Spotify case, Exhibit 3a: total revenues 430 and 747 million euros, +74%'
    fn: growthPct
    in: { before: 430, after: 747 }
    expect: { change: 317, pct: 0.7372 }
    tol: 0.001
  - id: subscription-growth
    source: 'Spotify case, Exhibit 3a: subscription revenues 375 and 679, +81%'
    fn: growthPct
    in: { before: 375, after: 679 }
    expect: { change: 304, pct: 0.8107 }
    tol: 0.001
  - id: advertising-growth
    source: 'Spotify case, Exhibit 3a: advertising revenues 55 and 68, +24%'
    fn: growthPct
    in: { before: 55, after: 68 }
    expect: { change: 13, pct: 0.2364 }
    tol: 0.001
  - id: operating-result
    source: 'Spotify case, Exhibit 3a: operating result -80 and -93, -16%'
    fn: growthPct
    in: { before: -80, after: -93 }
    expect: { change: -13, pct: -0.1625 }
    tol: 0.001
  - id: digital-growth
    source: 'Spotify case, Exhibit 1b: digital revenue 5.9 billion in 2013 and 6.9 billion in 2014'
    fn: growthPct
    in: { before: 5.9, after: 6.9 }
    expect: { change: 1, pct: 0.1695 }
    tol: 0.001
  - id: cd-decline
    source: 'Spotify case, Exhibit 2a: CD revenue 3,389 in 2010 and 2,124 in 2013'
    fn: growthPct
    in: { before: 3389, after: 2124 }
    expect: { change: -1265, pct: -0.3733 }
    tol: 0.001
  - id: premium-growth
    source: 'Spotify case, Exhibit 3b: premium subscribers 8 million in Q4 2013 and 12.5 million in Q3 2014'
    fn: growthPct
    in: { before: 8, after: 12.5 }
    expect: { change: 4.5, pct: 0.5625 }
    tol: 0.001
  - id: conversion
    source: 'Spotify case, page 1: 12.5 million paying subscribers out of 50 million active users'
    fn: shareOf
    in: { part: 12.5, whole: 50 }
    expect: { share: 0.25 }
    tol: 0.001
  - id: physical-share
    source: 'Spotify case, Exhibit 1a: 6.85 billion physical out of 15 billion'
    fn: shareOf
    in: { part: 6.85, whole: 15 }
    expect: { share: 0.4567 }
    tol: 0.001
  - id: performance-share
    source: 'Spotify case, Exhibit 1a: 0.89 billion performance rights out of 15 billion'
    fn: shareOf
    in: { part: 0.89, whole: 15 }
    expect: { share: 0.0593 }
    tol: 0.001
  - id: swift-weight
    source: 'Spotify case, pages 6 and 8: about 6 million dollars a year for Swift out of a projected 1 billion in royalties'
    fn: shareOf
    in: { part: 6, whole: 1000 }
    expect: { share: 0.006 }
    tol: 0.0005
  - id: royalty-example
    source: 'Spotify case, pages 5-6: 70% of revenue to rights holders, a share by streams, artists receive 15-20%'
    fn: royaltyPayout
    in: { revenue: 100, payoutRate: 0.7, streamShare: 0.05, artistCut: 0.2 }
    expect: { pool: 70, holder: 3.5, artist: 0.7 }
    tol: 0.005
  - id: swift-streams
    source: 'Spotify case, page 8: Spotify paid Universal about 500,000 dollars a month for Swift; 0.006 to 0.008 per stream'
    fn: streamsFor
    in: { payout: 500000, perStream: 0.007 }
    expect: { streams: 71428571 }
    tol: 1
  - id: swift-streams-low
    source: 'Spotify case, page 6: per-stream payout of 0.006'
    fn: streamsFor
    in: { payout: 500000, perStream: 0.006 }
    expect: { streams: 83333333 }
    tol: 1
  - id: swift-streams-high
    source: 'Spotify case, page 6: per-stream payout of 0.008'
    fn: streamsFor
    in: { payout: 500000, perStream: 0.008 }
    expect: { streams: 62500000 }
    tol: 1
  - id: download-vs-stream-mid
    source: 'Spotify case, page 2 and page 6: 0.99 song, retailer keeps 30%, 0.007 per stream'
    fn: downloadVsStream
    in: { price: 0.99, retailerCut: 0.3, perStream: 0.007 }
    expect: { net: 0.693, streams: 99 }
    tol: 0.001
  - id: download-vs-stream-low
    source: 'Spotify case, pages 2 and 6: 0.99 song and 0.006 per stream'
    fn: downloadVsStream
    in: { price: 0.99, retailerCut: 0.3, perStream: 0.006 }
    expect: { streams: 115.5 }
    tol: 0.001
  - id: subscription-annual
    source: 'Spotify case, page 1: 12.5 million subscribers at 9.99 dollars a month for a year'
    fn: subscriptionRevenue
    in: { subscribers: 12.5, price: 9.99, months: 12 }
    expect: { revenue: 1498.5 }
    tol: 0.005

scenes:
  - id: economic-systems
    title: Who owns the businesses?
    goal: Why do some governments run businesses while others leave them to private owners?
    skills: [govt-role]
    state: { animFrom: 0, animTo: 0.8 }
    stage:
      - id: sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: r1, label: Save jobs at a failing firm }
            - { id: r2, label: Follow an economic or political belief }
            - { id: r3, label: Control earlier investments }
            - { id: r4, label: Run things more efficiently }
            - { id: r5, label: Raise money for the government }
            - { id: r6, label: Reduce government bureaucracy }
          bins:
            - { id: nat, label: Reasons to nationalize }
            - { id: priv, label: Reasons to privatize }
          solution: { r1: nat, r2: nat, r3: nat, r4: priv, r5: priv, r6: priv }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/nationalization.webm, assets/anim/nationalization.mp4]
          poster: assets/anim/nationalization.poster.jpg
          alt: |
            A factory sits on a track from private (teal) to government (violet). A violet hand drags it to the government end and
            it turns violet; then a stack of coins carries it back toward the private end, where a buyer catches its keys.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.8, 1.6, 2.6, 3.3, 4.2, 5]
    beats:
      - say: |
          Every country lets its government play some role in business. What changes is who owns the shops and
          factories. Picture a line with all-private on the left and all-government on the right.
      - say: |
          On the left is a **market economy**: privately owned businesses, with supply and demand deciding what is made.
          On the right is a **command economy**: the government owns and controls the major industries. Most countries sit
          in between, in a **mixed economy** of both kinds of ownership.
        define: [market-economy, command-economy, mixed-economy]
        gate:
          type: predict
          question: In a mixed economy, who owns businesses?
          options: [Only the government, Only private owners, Both the government and private owners, Foreign firms only]
          answer: 2
          explain: A mixed economy combines state and private ownership.
      - say: |
          A government can move a firm across that line. **Nationalization** is taking privately owned property and
          making it publicly owned. Governments do it to save jobs, follow a belief, control past investments or enact
          political goals.
        define: [nationalization]
        set: { animFrom: 0.8, animTo: 2.6 }
      - say: |
          The reverse is **privatization**: selling government-owned property to private buyers. Governments sell to get more
          efficiency, to raise money or to cut bureaucracy.
        define: [privatization]
        set: { animFrom: 2.6, animTo: 5 }
        show: [sorter]
        gate:
          type: event
          prompt: Sort each reason into nationalize or privatize.
          target: sorter
          event: solved
          hint: Selling brings in money; taking over protects jobs.
      - say: |
          Governments also help their firms without owning them. **Strategic trade policy** uses tariffs, subsidies or
          quotas to shape how companies compete. It can raise home firms' market share, but protection can lower world
          welfare and slow innovation.
        define: [strategic-trade-policy]
        hide: [anim, sorter]
      - say: One more thought.
        gate:
          type: reflect
          prompt: Why might a government-owned firm have an unfair advantage over a private rival?
          model: |
            A state firm can borrow cheaply, get subsidies and win government contracts, and it does not have to earn a
            profit to survive. A private rival must earn its way and may face rules the state firm does not.
    takeaway: Economies range from private to state ownership, and governments can move firms across the line.

  - id: stability-and-risk
    title: Is it safe to do business there?
    goal: How can a firm judge the danger of working in another country?
    skills: [stability-risk]
    data: [piracy]
    state: { year: '2018' }
    derive:
      - { fn: piracyYear, in: { table: '@piracy', year: '@year' }, out: pa }
    stage:
      - id: risk-note
        widget: Callout
        props:
          kind: note
          title: Political and physical risks
          body: |
            Firms check whether policy stays predictable (**stability** vs **instability**) and whether people, cargo and data face **terrorism**, **kidnapping**, **piracy** or **cybercrime**.
      - id: chart
        widget: Chart
        hidden: true
        props:
          kind: line
          title: Maritime piracy incidents by region (Table 5.1)
          xLabel: Year
          yLabel: Incidents
          series:
            - { name: Africa, x: ['2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022'], y: [79, 55, 70, 122, 151, 121, 110, 47, 30, 16] }
            - { name: Asia, x: ['2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022'], y: [167, 183, 202, 101, 95, 98, 89, 62, 39, 56] }
            - { name: Latin America, x: ['2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022'], y: [18, 5, 8, 27, 71, 85, 84, 22, 28, 23] }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Africa, value: '@pa.africa' }
            - { label: Asia, value: '@pa.asia' }
            - { label: Latin America and the Caribbean, value: '@pa.latam' }
            - { label: Rest of world, value: '@pa.rest' }
            - { label: Sum of the regions, value: '@pa.total', tone: good }
      - id: yearpick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Year
          style: dropdown
          options:
            - { value: '2013', label: '2013' }
            - { value: '2014', label: '2014' }
            - { value: '2015', label: '2015' }
            - { value: '2016', label: '2016' }
            - { value: '2017', label: '2017' }
            - { value: '2018', label: '2018' }
            - { value: '2019', label: '2019' }
            - { value: '2020', label: '2020' }
            - { value: '2021', label: '2021' }
            - { value: '2022', label: '2022' }
        bind: { value: year }
    beats:
      - say: |
          Before a firm opens an office abroad, it asks whether the country is safe. A **government stability** check asks
          whether leaders stay in power and keep their tax, money and political policies predictable.
        define: [stability]
      - say: |
          The opposite is **government instability**: a government that cannot stay in power, or that makes sudden,
          unpredictable or radical policy changes. Surprises like these can be very costly for a business.
        define: [instability]
      - say: |
          Danger also comes from violence. **Terrorism and political violence** are unlawful acts that threaten people and
          property. **Kidnapping** targets businesspeople for ransom and can fund terrorists.
        define: [terrorism, kidnapping]
      - say: |
          At sea there is **maritime piracy**, hijacking ships and crews. Online there is **cybercrime**: hacking,
          ransomware and data theft. Table 5.1 tracks piracy incidents by region across the decade.
        define: [piracy, cybercrime]
        hide: [risk-note]
        show: [chart]
        gate:
          type: predict
          question: In 2018 the table shows Africa 121, Asia 98, Latin America 85 and the rest 0. What is the total?
          answer: { value: 304, tol: 0.5 }
          explain: 121 + 98 + 85 + 0 = 304, matching the printed total.
      - say: |
          Notice how the main hotspot shifted from Asia to Africa in the mid-2010s. Use the year menu to inspect the peak year for Africa.
        show: [r, yearpick]
        gate:
          type: when
          prompt: Find the year in which Africa had more than 140 piracy incidents.
          when: 'pa.africa > 140'
          hint: Look at the Africa line on the chart around 2017.
      - say: |
          A **country risk assessment** pulls all this together: it studies a country's economy and politics to judge how
          much danger its people, property and investments face there.
        define: [country-risk-assessment]
      - say: Work out a share on your own.
        gate:
          type: practice
          template: piracy-share-numeric
      - say: And a change over time.
        gate:
          type: practice
          template: piracy-change-numeric
    takeaway: Stable policies and safe people and property make a country attractive; tables of incidents help judge the risk.

  - id: tariffs
    title: The price of crossing a border
    goal: How much extra does a shipment cost once it has to pay a border tax?
    skills: [duties, levy]
    state: { value: 10000, units: 500, adValoremRate: 0.1, specificPerUnit: 2, worldPrice: 300, supportedPrice: 350, animFrom: 0, animTo: 0.6 }
    derive:
      - { fn: importDuty, in: { value: '@value', units: '@units', adValoremRate: '@adValoremRate', specificPerUnit: '@specificPerUnit' }, out: d }
      - { fn: variableLevy, in: { worldPrice: '@worldPrice', supportedPrice: '@supportedPrice' }, out: v }
    stage:
      - id: r-in
        widget: Readout
        props:
          items:
            - { label: Invoice value, value: '@value' }
            - { label: Units shipped, value: '@units' }
            - { label: Ad valorem rate, value: '{=adValoremRate|pct}' }
            - { label: Specific duty per unit, value: '@specificPerUnit' }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Invoice value, value: '@value' }
            - { label: Ad valorem part, value: '@d.adValorem', tone: accent }
            - { label: Specific part, value: '@d.specific', tone: accent }
            - { label: Total duty, value: '@d.duty', tone: good }
            - { label: Landed cost, value: '@d.landed', tone: good }
      - id: rate
        widget: Slider
        region: side
        hidden: true
        props: { label: Ad valorem rate (0.1 = 10%), min: 0, max: 0.3, step: 0.05 }
        bind: { value: adValoremRate }
      - id: lev
        widget: Readout
        hidden: true
        props:
          items:
            - { label: World price, value: '@worldPrice' }
            - { label: Supported price, value: '@supportedPrice' }
            - { label: Levy, value: '@v.levy', tone: accent }
            - { label: Entry price, value: '@v.entryPrice', tone: good }
      - id: world-slider
        widget: Slider
        region: side
        hidden: true
        props: { label: World price, min: 250, max: 350, step: 10 }
        bind: { value: worldPrice }
      - id: anim
        widget: Animation
        region: top
        hidden: true
        props:
          src: [assets/anim/tariff-mechanisms.webm, assets/anim/tariff-mechanisms.mp4]
          poster: assets/anim/tariff-mechanisms.poster.jpg
          alt: |
            A crate of 500 chairs worth 10,000 dollars rolls up to a customs arch. A 10% slice of its value bar (1,000 dollars) is
            cut off; then a 2-dollar coin drops on each chair, and the two duties stack on the crate as a compound duty. Last, a
            world-price bar bobs up and down while a coral levy on top stretches so the total stays on the 350-dollar support line:
            world 300 plus levy 50.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.9, 2.0, 3.6, 4.8]
    beats:
      - say: |
          A country trades by **importing**, buying goods from abroad, and **exporting**, selling goods abroad. Governments
          often tax what comes in. A shipment of 500 chairs worth 10,000 dollars arrives at the border.
        define: [import-goods, export]
        show: [anim]
      - say: |
          The tax is a **tariff**: a tax on imported goods that raises their price so local producers face less
          competition. There are several ways to charge it.
        define: [tariff]
      - say: |
          An **ad valorem duty** is a percentage of the invoice value. A 10% duty on 10,000 dollars is 1,000 dollars. The
          Latin words mean "according to value".
        define: [ad-valorem-duty]
        set: { animFrom: 0.6, animTo: 1.2 }
      - say: |
          A **specific duty** is a fixed amount per unit, say 2 dollars per chair. A **compound duty** uses both. With 500
          chairs and a 10% ad valorem rate, estimate the compound duty.
        define: [specific-duty, compound-duty]
        set: { animFrom: 1.2, animTo: 3.0 }
        gate:
          type: predict
          question: What is the total compound duty on 500 chairs worth 10,000 dollars (10% plus 2 dollars per chair)?
          answer: { value: 2000, tol: 0.5 }
          explain: Ad valorem 1,000 plus specific 500 × 2 = 1,000, so 2,000 dollars.
      - say: Now steer the rate yourself and see how the total duty and landed cost respond.
        hide: [r-in, anim]
        show: [r, rate]
        gate:
          type: when
          prompt: Set the ad valorem rate so the total duty is 3,000 dollars.
          when: 'd.duty > 2999 and d.duty < 3001'
          hint: The specific part stays at 1,000, so the percentage part must reach 2,000.
      - say: |
          Farm goods have another tool. A **variable levy** is an import duty set at the gap between a low world price and
          the higher price the government supports at home. Move the world price slider and notice how the levy adjusts so the entry price stays at 350.
        define: [variable-levy]
        set: { animFrom: 3.0, animTo: 5.0 }
        hide: [rate, r]
        show: [lev, world-slider, anim]
      - say: Try a plain ad valorem question.
        hide: [world-slider, anim]
        gate:
          type: practice
          template: duty-landed-numeric
      - say: And a levy.
        gate:
          type: practice
          template: levy-numeric
    takeaway: Add the percentage part and the per-unit part to get the duty, and add the duty to the value to get the landed cost.

  - id: other-barriers
    title: Other ways to keep goods out
    goal: What can a government do besides taxing imports?
    skills: [trade-barriers]
    state: { exportPrice: 90, homePrice: 100, cost: 95, animFrom: 0, animTo: 1 }
    derive:
      - { fn: dumpingTest, in: { exportPrice: '@exportPrice', homePrice: '@homePrice', cost: '@cost' }, out: dm }
    stage:
      - id: sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: b1, label: Ad valorem duty }
            - { id: b2, label: Quota }
            - { id: b3, label: Local content rule }
            - { id: b4, label: Specific duty }
            - { id: b5, label: Voluntary export restraint }
            - { id: b6, label: Variable levy }
          bins:
            - { id: tariff, label: Tariffs }
            - { id: ntb, label: Nontariff barriers }
          solution: { b1: tariff, b2: ntb, b3: ntb, b4: tariff, b5: ntb, b6: tariff }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/non-tariff-barriers.webm, assets/anim/non-tariff-barriers.mp4]
          poster: assets/anim/non-tariff-barriers.poster.jpg
          alt: |
            Five quick scenes. A crate is turned back at a barrier with a ban sign. A government hand drops coins under a home
            factory and its cost bar shrinks. A quota counter ticks to 3 of 3 and a gate shuts in front of the fourth crate. A car
            frame fills with three home-made parts and one foreign part. Last, three price bars, home 100, cost 95 and export 90;
            the export bar is circled as dumping, a violet subsidy coin drops to the exporter, and a countervailing-duty block
            lifts the export bar to 100.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.9, 1.9, 3.1, 3.9, 4.7, 5.9]
      - id: r-in
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Export price, value: '@exportPrice' }
            - { label: Home price, value: '@homePrice' }
            - { label: Cost, value: '@cost' }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Export price, value: '@exportPrice' }
            - { label: Home price, value: '@homePrice' }
            - { label: Cost, value: '@cost' }
            - { label: Below home price, value: '{=dm.belowHome}', tone: accent }
            - { label: Below cost, value: '{=dm.belowCost}', tone: accent }
    beats:
      - say: |
          The strictest tools are bans. An **import ban** forbids bringing in certain goods or know-how.
          An **export ban** forbids sending them out, usually because they threaten national security or economic interests.
        define: [import-ban, export-ban]
      - say: |
          A **subsidy** is money or tax relief from the government to a firm, such as grants or lower taxes. It is used
          to help exports or to shield a firm from imports.
        define: [subsidy]
        set: { animFrom: 1, animTo: 2 }
      - say: |
          Anything that discriminates against imports without an import duty is a **nontariff barrier**. One kind is the
          **quota**: a numerical limit on how much of a good may enter.
        define: [nontariff-barrier, quota]
        set: { animFrom: 2, animTo: 3.2 }
      - say: |
          Two more: a **voluntary export restraint** is a limit the exporting country sets on itself, and a
          **local content requirement** forces firms to use goods and services made in the host country.
        define: [voluntary-export-restraint, local-content-requirement]
        set: { animFrom: 3.2, animTo: 4 }
      - say: Now sort the tools you have met.
        show: [sorter]
        hide: [anim]
        gate:
          type: event
          prompt: Sort each tool into tariffs or nontariff barriers.
          target: sorter
          event: solved
          hint: A tariff is a tax on imports. Anything else is a nontariff barrier.
      - say: |
          Sometimes a barrier is aimed at unfair pricing. **Dumping** is selling a product abroad for less than it costs to
          make, or for less than its price at home. A firm exports at 90, sells at home for 100 and has costs of 95.
        define: [dumping]
        set: { animFrom: 4, animTo: 4.8 }
        hide: [sorter]
        show: [r-in, anim]
        gate:
          type: predict
          question: Is the firm dumping?
          options: [Yes, No]
          answer: 0
          explain: 90 is below both the home price (100) and the cost (95).
      - say: |
          The importing country can fight back against subsidies with a **countervailing duty**: an extra import tax on goods
          that benefited from export subsidies, set to cancel the help.
        define: [countervailing-duty]
        set: { animFrom: 4.8, animTo: 6 }
        hide: [r-in]
        show: [r]
        gate:
          type: practice
          template: dump-mcq
    takeaway: Bans, quotas, local content rules and standards keep goods out without tariffs, and duties answer dumping and subsidies.

  - id: political-reasons
    title: Why governments restrict trade
    goal: What reasons do governments give for blocking foreign goods?
    skills: [govt-role, protection-cost]
    state: { risePerUnit: 2, quantity: 50000, jobsProtected: 20 }
    derive:
      - { fn: protectionCost, in: { risePerUnit: '@risePerUnit', quantity: '@quantity', jobsProtected: '@jobsProtected' }, out: pc }
    stage:
      - id: motives-note
        widget: Callout
        props:
          kind: note
          title: Political arguments for trade barriers
          body: |
            Governments cite **national defense**, **sanctions**, **protecting jobs** and **retaliation** against unfair trade, though each carries economic costs for domestic buyers and exporters.
      - id: r-in
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Price rise per unit, value: '@risePerUnit' }
            - { label: Units bought, value: '@quantity' }
            - { label: Jobs protected, value: '@jobsProtected' }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Price rise per unit, value: '@risePerUnit' }
            - { label: Units bought, value: '@quantity' }
            - { label: Extra cost to buyers, value: '@pc.buyersPay', tone: accent }
            - { label: Jobs protected, value: '@jobsProtected' }
            - { label: Cost per job, value: '@pc.perJob', tone: good }
      - id: sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: m1, label: Ban sales of military technology }
            - { id: m2, label: Tariff to punish a country's behavior }
            - { id: m3, label: Add a duty so imports cost as much as local goods }
            - { id: m4, label: Countervailing duty after a rival's subsidy }
          bins:
            - { id: defense, label: National defense }
            - { id: sanction, label: Sanctions }
            - { id: fair, label: Fair competition }
            - { id: retal, label: Retaliation }
          solution: { m1: defense, m2: sanction, m3: fair, m4: retal }
          shuffle: true
    beats:
      - say: |
          Governments give many political reasons for restricting trade. One is national defense: industries vital to
          security need protection from imports. Economists call this a weak argument, often used for emotional effect.
        gate:
          type: predict
          question: Technology export bans keep secrets at home. What else do they do to the country's own makers?
          options: [Close off foreign markets, Raise their exports, Lower foreign prices, Nothing]
          answer: 0
          explain: Bans reduce export revenue for the country's manufacturers and can slow their innovation.
      - say: |
          Another is **sanctions**: trade penalties placed on a country to punish it or push it to change. They seldom reach
          their goal and often hurt the country that applies them.
        define: [sanctions]
      - say: |
          To protect jobs, governments may use tariffs. A **nuisance tariff** is a very low rate that is annoying enough to
          discourage importing or to push a foreign firm to supply locally. The "cheap foreign labor" argument is weak,
          because wages are not the only cost.
        define: [nuisance-tariff]
      - say: |
          Protecting jobs has a price. Suppose a tariff adds 2 dollars to a good that people buy 50,000 times a year,
          and it saves 20 jobs. Work out what each saved job costs buyers.
        hide: [motives-note]
        show: [r-in]
        gate:
          type: predict
          question: If buyers pay 2 dollars extra on 50,000 units to protect 20 jobs, how much does each job cost buyers?
          answer: { value: 5000, tol: 0.5 }
          explain: Extra cost to buyers is 2 × 50,000 = 100,000 dollars. Divided across 20 jobs, that is 5,000 dollars per job.
      - say: Now do one on your own.
        hide: [r-in]
        show: [r]
        gate:
          type: practice
          template: protect-numeric
      - say: |
          Governments also worry about the **race to the bottom**, where countries lower labor and environmental standards
          to win business until everyone's standards fall.
        define: [race-to-the-bottom]
        hide: [r]
        show: [motives-note]
      - say: |
          Finally, **retaliation**: answering another country's restrictions, often caused by dumping or subsidies, with
          restrictions of your own. Match each action to its motive.
        define: [retaliation]
        hide: [motives-note]
        show: [sorter]
        gate:
          type: event
          prompt: Place every action under the right motive.
          target: sorter
          event: solved
      - say: Last question.
        hide: [sorter]
        gate:
          type: reflect
          prompt: US sugar quotas help a small group of farmers while many consumers pay more. Is that a good reason for a quota?
          model: |
            The farmers gain a lot each, so they lobby hard. The cost is spread thinly across millions of buyers, who barely
            notice it. A policy can look popular and still cost the country more than it gains.
    takeaway: Defense, jobs, fairness and revenge are common reasons for restrictions, but each has costs.

  - id: economic-reasons
    title: Protecting a young industry
    goal: When might shielding an industry from competition be sensible?
    skills: [govt-role]
    state: { animFrom: 0, animTo: 2.6 }
    stage:
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/infant-industry.webm, assets/anim/infant-industry.mp4]
          poster: assets/anim/infant-industry.poster.jpg
          alt: |
            A small teal home factory with a tall cost bar faces a big gold factory abroad sending cheap crates. A violet dome
            drops over the home factory and the crates bounce off; inside, it grows and its cost bar shrinks. A "1st" flag goes
            up on the big factory (it got there first) while the home factory reaches full size. Then the dome lifts away, a crate
            arrives, and the home factory holds its ground.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.8, 1.6, 2.5, 3.5, 4.9]
    beats:
      - say: |
          A new firm in a poor country cannot compete with a giant abroad on day one. An **infant industry** is a young
          industry a government shields from imports for a while so it can grow. Without help, low-cost imports would
          underprice it.
        define: [infant-industry]
        gate:
          type: predict
          question: Protection for an infant industry is meant to be…
          options: [Temporary, Permanent, Unrelated to growth, Aimed at raising prices]
          answer: 0
          explain: The idea is to give the industry time to build strength, then remove the shield.
      - say: |
          Governments also act to win a head start. A **first-mover advantage** is the lead a company or country gets by
          entering a market first. Policies may protect emerging sectors to overcome other nations' first-mover advantages.
        define: [first-mover-advantage]
        set: { animFrom: 2.6, animTo: 5 }
      - say: Now test yourself.
        hide: [anim]
        gate:
          type: practice
          template: infant-mcq
      - say: A final thought on the idea.
        gate:
          type: reflect
          prompt: What is the main risk of protecting an infant industry?
          model: |
            The industry may never grow up. Protected from rivals it can stay inefficient, and consumers keep paying higher
            prices, while other industries that sell abroad may face retaliation.
    takeaway: A temporary shield may help young industries, but permanent protection can leave them weak.

id: strategies
kind: table
title: The four international strategies and the pressures that suit them
source: 'M9, slide 23 (text) and Figure 9.3 (image, not extracted)'
description: Cost pressure is how strongly the market pushes to cut costs. Adaptation pressure is how strongly local markets want products changed. Home replication is placed at low and low by inference from the slide text.
columns: [strategy, cost, adapt, idea]
rows:
  - [Home replication, low, low, 'Product development stays at home; existing products and processes are transferred']
  - [Multidomestic, low, high, 'Products and services are adapted to each local market']
  - [Global, high, low, 'Standard products, with costs cut by using the best locations']
  - [Transnational, high, high, 'Standardize when possible and adapt when necessary']

terms:
  - id: market-economy
    term: Market economy
    aka: [market economies]
    short: An economy where businesses are privately owned and what gets made is set by supply and demand.
    related: [command-economy, mixed-economy]
    skills: [govt-role]
  - id: command-economy
    term: Command economy
    aka: [command economies]
    short: An economy where the government owns and controls the major industries and decides what gets made.
    related: [market-economy, mixed-economy]
    skills: [govt-role]
  - id: mixed-economy
    term: Mixed economy
    aka: [mixed economies]
    short: An economy that mixes government ownership of some businesses with private ownership of others.
    related: [market-economy, command-economy]
    skills: [govt-role]
  - id: nationalization
    term: Nationalization
    short: The government taking privately owned property and turning it into a publicly owned asset.
    related: [privatization]
    skills: [govt-role]
  - id: privatization
    term: Privatization
    short: The government selling publicly owned property to private buyers.
    related: [nationalization]
    skills: [govt-role]
  - id: strategic-trade-policy
    term: Strategic trade policy
    short: Using tariffs, subsidies or quotas to shape how companies compete, so that home firms win a bigger share.
    related: [tariff, subsidy, quota]
    skills: [govt-role]
  - id: stability
    term: Government stability
    aka: [stable government, stable]
    short: A government that stays in power and keeps its money, tax and political policies predictable.
    related: [instability]
    skills: [stability-risk]
  - id: instability
    term: Government instability
    aka: [unstable government, unstable]
    short: A government that cannot keep itself in power, or that makes sudden, unpredictable or radical policy changes.
    related: [stability]
    skills: [stability-risk]
  - id: terrorism
    term: Terrorism and political violence
    aka: [terrorism]
    short: Unlawful acts of violence committed for political or other reasons that threaten people and property.
    related: [kidnapping]
    skills: [stability-risk]
  - id: kidnapping
    term: Kidnapping
    short: Seizing people, often businesspeople, to demand money. It can fund terrorist groups.
    related: [terrorism, piracy]
    skills: [stability-risk]
  - id: piracy
    term: Maritime piracy
    aka: [piracy]
    short: Hijacking ships and kidnapping crews at sea.
    related: [kidnapping]
    skills: [stability-risk]
  - id: cybercrime
    term: Cybercrime
    short: Any illegal activity carried out over electronic networks, such as hacking, ransomware or data theft.
    related: [terrorism]
    skills: [stability-risk]
  - id: country-risk-assessment
    term: Country risk assessment
    aka: [CRA, country risk]
    short: A study of a country's economy and politics to judge how much danger its people, property and investments face there.
    related: [stability, instability]
    skills: [stability-risk]
  - id: import
    term: Import
    aka: [imports, importing]
    short: A good or service bought from another country and brought in.
    related: [export, tariff]
    skills: [duties]
  - id: export
    term: Export
    aka: [exports, exporting]
    short: A good or service sold to another country and sent out.
    related: [import]
    skills: [duties]
  - id: tariff
    term: Tariff
    aka: [tariffs, import tariff, import duty]
    short: A tax on imported goods, meant to raise their price so local producers face less competition.
    related: [ad-valorem-duty, specific-duty, compound-duty]
    skills: [duties]
  - id: ad-valorem-duty
    term: Ad valorem duty
    aka: [ad valorem]
    short: An import duty charged as a percentage of the invoice value of the goods.
    formula: '\text{duty} = \text{rate} \times \text{value}'
    related: [specific-duty, compound-duty]
    skills: [duties]
  - id: specific-duty
    term: Specific duty
    short: An import duty charged as a fixed amount for each physical unit of the good.
    formula: '\text{duty} = \text{amount per unit} \times \text{units}'
    related: [ad-valorem-duty, compound-duty]
    skills: [duties]
  - id: compound-duty
    term: Compound duty
    short: An import duty that combines a percentage of the value with a fixed amount per unit.
    formula: '\text{duty} = \text{rate} \times \text{value} + \text{amount per unit} \times \text{units}'
    related: [ad-valorem-duty, specific-duty]
    skills: [duties]
  - id: variable-levy
    term: Variable levy
    short: An import duty set equal to the gap between the lower world price and the higher price the government supports at home.
    formula: '\text{levy} = \text{supported price} - \text{world price}'
    related: [tariff]
    skills: [levy]
  - id: import-ban
    term: Import ban
    aka: [import bans]
    short: A rule that forbids bringing in certain goods or know-how, from everywhere or from named people, groups or countries.
    related: [export-ban]
    skills: [trade-barriers]
  - id: export-ban
    term: Export ban
    aka: [export bans, export controls]
    short: A rule that forbids sending certain goods or know-how out of the country, either everywhere or to named buyers.
    related: [import-ban]
    skills: [trade-barriers]
  - id: subsidy
    term: Subsidy
    aka: [subsidies]
    short: Money or tax relief from the government to a firm, such as grants or lower taxes, that gives it an advantage.
    related: [countervailing-duty]
    skills: [trade-barriers]
  - id: nontariff-barrier
    term: Nontariff barrier
    aka: [NTB, NTBs, nontariff barriers]
    short: Any way of discriminating against imports other than charging import duties.
    related: [quota, local-content-requirement]
    skills: [trade-barriers]
  - id: quota
    term: Quota
    aka: [quotas]
    short: A numerical limit on how much of a certain good may be imported.
    related: [voluntary-export-restraint]
    skills: [trade-barriers]
  - id: voluntary-export-restraint
    term: Voluntary export restraint
    aka: [VER, VERs]
    short: A limit on exports that the exporting country sets for itself, usually after pressure from an importing country.
    related: [quota]
    skills: [trade-barriers]
  - id: local-content-requirement
    term: Local content requirement
    aka: [LCR, LCRs]
    short: A rule that a firm must use goods and services made in the host country in order to operate there.
    related: [nontariff-barrier]
    skills: [trade-barriers]
  - id: dumping
    term: Dumping
    short: Selling a product abroad for less than it costs to make, or for less than its price at home or in third countries.
    related: [countervailing-duty]
    skills: [trade-barriers]
  - id: countervailing-duty
    term: Countervailing duty
    aka: [countervailing duties, CVD]
    short: An extra import tax on goods that benefited from export subsidies, set to cancel out that unfair help.
    related: [subsidy, dumping]
    skills: [trade-barriers]
  - id: sanctions
    term: Sanctions
    short: Trade penalties placed on a country to punish it or push it to change its behavior.
    related: [retaliation]
    skills: [govt-role]
  - id: nuisance-tariff
    term: Nuisance tariff
    aka: [nuisance tariffs]
    short: A very low tariff that is annoying enough to discourage importing or to push a foreign firm to supply locally.
    related: [tariff]
    skills: [govt-role]
  - id: race-to-the-bottom
    term: Race to the bottom
    short: Countries or firms lowering labor and environmental standards to win business, until all standards fall.
    related: [sanctions]
    skills: [govt-role]
  - id: retaliation
    term: Retaliation
    short: Striking back at another country's trade restrictions with restrictions of your own, often after dumping or subsidies.
    related: [countervailing-duty, sanctions]
    skills: [govt-role]
  - id: infant-industry
    term: Infant industry
    aka: [infant industries]
    short: A young industry that a government shields from imports for a while so it can grow strong enough to compete.
    related: [first-mover-advantage]
    skills: [govt-role]
  - id: first-mover-advantage
    term: First-mover advantage
    short: The lead that a company or country gets from entering a market before anyone else.
    related: [infant-industry]
    skills: [govt-role]

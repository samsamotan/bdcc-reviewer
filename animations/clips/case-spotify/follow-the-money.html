<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Following the money</title>
  <link rel="stylesheet" href="../../kit/kit.css">
  <script src="../../kit/vendor/gsap.min.js"></script>
  <script src="../../kit/kit.js"></script>
</head>
<body>
  <!-- Spotify case · who-gets-paid, beat 2 · 6 s. -->
  <div id="stage" data-composition-id="follow-the-money" data-start="0" data-width="1280" data-height="720" data-duration="6"></div>
  <script>
    /*
     * Spotify case · following the money (scene who-gets-paid, beat 2), 6 s.
     *   0.0–1.0  a crowd of tiny listeners in headphones bobs to a beat; coins rain into a wide channel: $100M
     *   1.0–2.0  the channel forks: 30% peels off to a green streaming building (a generic play circle), leaving a $70M pool
     *   2.0–3.6  the pool is a pie of many rights holders; a 5% slice lifts out and flows down to a record label: $3.5M
     *   3.6–5.0  a thin trickle runs on through a 20% gate to an artist with a guitar: $0.7M; the artist looks and blinks
     *   5.0–6.0  hold; the camera eases out so the whole funnel, wide at the top and thin at the bottom, is in view
     */
    (() => {
      const { C } = HF;
      const tl = HF.timeline(6);
      window.__timelines['follow-the-money'] = tl; // (HF.timeline registers it too; this line is for the HyperFrames linter)
      const pipes = HF.layer('pipes');
      const things = HF.layer('things');
      const fx = HF.layer('fx');

      const CH = { x0: 220, x1: 1000, y: 214 };     // wide channel
      const POOL = { x: 600, y: 368, r: 88 };       // the rights-holders pie
      const LABEL = { x: 600, y: 612 };             // record label building (bottom centre)
      const SPOT = { x: 1130, y: 392 };             // streaming building (bottom centre)
      const ART = { x: 1010, y: 676 };              // artist (feet)
      const GATE = { x: 830, y: 640 };

      // ---------------------------------------------------------------- listeners
      const crowd = [];
      const rand = HF.rng(5);
      const LIST_COLORS = [C.teal, C.coral, '#7FD8F0', C.violet, '#EDE6CF', C.gold];
      for (let i = 0; i < 9; i++) {
        const x = 270 + i * 92 + (rand() - 0.5) * 16, y = 140 + (i % 2) * 12;
        const ch = HF.character(things, { x, y, color: LIST_COLORS[i % LIST_COLORS.length], size: 0.78 });
        const hp = HF.g(ch.inner);
        HF.el('path', { d: 'M-27 -40 Q-27 -80 0 -80 Q27 -80 27 -40', fill: 'none', stroke: '#DDE4FA', 'stroke-width': 6, 'stroke-linecap': 'round' }, hp);
        HF.box(hp, { x: -35, y: -52, w: 15, h: 24, r: 7, color: '#DDE4FA', hi: false });
        HF.box(hp, { x: 20, y: -52, w: 15, h: 24, r: 7, color: '#DDE4FA', hi: false });
        gsap.set(ch.g, { scale: 0, transformOrigin: '50% 100%' });
        crowd.push(ch);
      }

      // ---------------------------------------------------------------- channels and buildings
      const flowColor = C.gold;
      // wide channel: a trough with a gold flow that fills left → right
      const trough = HF.g(pipes);
      HF.box(trough, { x: CH.x0, y: CH.y - 24, w: CH.x1 - CH.x0, h: 48, r: 24, color: '#2C3F7E', hi: false, shadeK: 0.05 });
      const flow = HF.el('rect', { x: CH.x0 + 8, y: CH.y - 14, width: CH.x1 - CH.x0 - 16, height: 28, rx: 14, fill: flowColor }, trough);
      gsap.set(flow, { scaleX: 0, transformOrigin: '0% 50%' });

      /** A pipe (stroke) that reveals along its length. */
      function pipe(d, width, color = flowColor) {
        const bed = HF.el('path', { d, fill: 'none', stroke: '#2C3F7E', 'stroke-width': width + 14, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pipes);
        const p = HF.el('path', { d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pipes);
        const len = p.getTotalLength();
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        gsap.set(bed, { opacity: 0 });
        return { p, bed, len };
      }
      const branch = pipe(`M${CH.x1 - 30} ${CH.y + 10} Q${SPOT.x} ${CH.y + 10} ${SPOT.x} ${SPOT.y - 112}`, 14);
      const toPool = pipe(`M${POOL.x} ${CH.y + 16} L${POOL.x} ${POOL.y - POOL.r - 6}`, 22);
      const toLabel = pipe(`M${POOL.x} ${POOL.y + POOL.r + 6} L${LABEL.x} ${LABEL.y - 124}`, 7);
      const trickle = pipe(`M${LABEL.x + 66} ${LABEL.y - 40} Q${GATE.x - 40} ${LABEL.y - 40} ${GATE.x} ${GATE.y - 20} Q${GATE.x + 50} ${ART.y - 70} ${ART.x - 46} ${ART.y - 52}`, 3);

      // streaming building with a generic green play circle
      const spot = HF.g(things);
      HF.box(spot, { x: SPOT.x - 70, y: SPOT.y - 112, w: 140, h: 112, r: 18, color: '#E3E6F5' });
      HF.disc(spot, { x: SPOT.x, y: SPOT.y - 58, r: 32, color: C.green });
      HF.el('path', { d: `M${SPOT.x - 9} ${SPOT.y - 74} L${SPOT.x + 15} ${SPOT.y - 58} L${SPOT.x - 9} ${SPOT.y - 42} Z`, fill: '#FFFFFF' }, spot);
      gsap.set(spot, { scale: 0, transformOrigin: '50% 100%' });

      // the pool: a pie of many rights holders; slice 0 is the 5% one
      const pie = HF.g(things);
      const SLICE_COLORS = [C.teal, C.coral, '#7FD8F0', C.violet, '#EDE6CF', '#3DDC84', '#F4A3C0', '#9FB3F0'];
      const shares = [0.05, 0.08, 0.06, 0.1, 0.07, 0.05, 0.09, 0.04, 0.06, 0.08, 0.05, 0.07, 0.06, 0.04, 0.1];
      const slices = [];
      let a0 = 90 - 9; // the 5% slice sits at the bottom, pointing down the narrow channel
      shares.forEach((sh, i) => {
        const a1 = a0 + sh * 360;
        const r = (a) => (a * Math.PI) / 180;
        const p0 = [POOL.x + POOL.r * Math.cos(r(a0)), POOL.y + POOL.r * Math.sin(r(a0))];
        const p1 = [POOL.x + POOL.r * Math.cos(r(a1)), POOL.y + POOL.r * Math.sin(r(a1))];
        const s = HF.el('path', { d: `M${POOL.x} ${POOL.y} L${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${POOL.r} ${POOL.r} 0 ${sh > 0.5 ? 1 : 0} 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Z`, fill: i === 0 ? C.gold : SLICE_COLORS[i % SLICE_COLORS.length], stroke: '#13254B', 'stroke-width': 2.5 }, pie);
        slices.push({ s, mid: (a0 + a1) / 2 });
        a0 = a1;
      });
      slices.forEach((k) => gsap.set(k.s, { scale: 0, svgOrigin: `${POOL.x} ${POOL.y}` }));

      // record label building with a vinyl on its front
      const label = HF.g(things);
      HF.box(label, { x: LABEL.x - 66, y: LABEL.y - 124, w: 132, h: 124, r: 16, color: C.violet });
      HF.disc(label, { x: LABEL.x, y: LABEL.y - 66, r: 34, color: '#1A2858', hi: false });
      HF.el('circle', { cx: LABEL.x, cy: LABEL.y - 66, r: 22, fill: 'none', stroke: '#2C3F7E', 'stroke-width': 2 }, label);
      HF.disc(label, { x: LABEL.x, y: LABEL.y - 66, r: 10, color: C.gold, hi: false });
      gsap.set(label, { scale: 0, transformOrigin: '50% 100%' });

      // the 20% gate
      const gate = HF.g(things);
      HF.box(gate, { x: GATE.x - 34, y: GATE.y - 64, w: 12, h: 76, r: 6, color: HF.shade(C.violet, 0.05), hi: false });
      HF.box(gate, { x: GATE.x + 22, y: GATE.y - 64, w: 12, h: 76, r: 6, color: HF.shade(C.violet, 0.05), hi: false });
      HF.box(gate, { x: GATE.x - 40, y: GATE.y - 76, w: 80, h: 18, r: 9, color: C.violet, hi: false });
      HF.text(gate, '20%', { x: GATE.x, y: GATE.y - 86, size: 22, color: '#C4A3F2', weight: 900 });
      gsap.set(gate, { scale: 0, transformOrigin: '50% 100%' });

      // the artist with a guitar
      const artist = HF.character(things, { x: ART.x, y: ART.y, color: '#E9E1C9', size: 1.15, look: -0.9 });
      // guitar held low across the body, neck pointing up and away from the face
      const guitar = HF.g(artist.inner);
      HF.el('rect', { x: 14, y: -48, width: 7, height: 44, rx: 3.5, fill: '#7A5236', transform: 'rotate(55 17 -26)' }, guitar);
      HF.el('rect', { x: 46, y: -54, width: 12, height: 9, rx: 3, fill: '#5A3E2B', transform: 'rotate(55 52 -50)' }, guitar);
      HF.el('ellipse', { cx: -2, cy: -14, rx: 19, ry: 14, fill: C.gold, transform: 'rotate(-30 -2 -14)' }, guitar);
      HF.el('circle', { cx: -2, cy: -14, r: 5, fill: '#7A5236' }, guitar);
      gsap.set(artist.g, { scale: 0, transformOrigin: '50% 100%' });

      // money labels
      const lab = (html, x, y, anchor = 'left', cls = 'pill hf-gold') => {
        const l = HF.label(html, { x, y, anchor, cls, html: true });
        return { l, n: l.querySelector('.hf-num') };
      };
      const m100 = lab('$<span class="hf-num">0</span>M', CH.x0 - 16, CH.y, 'right');
      const m30 = lab('30%', SPOT.x + 14, CH.y + 70, 'left', 'sm pill');
      const m70 = lab('$<span class="hf-num">100</span>M', POOL.x - POOL.r - 20, POOL.y, 'right');
      const m35 = lab('$<span class="hf-num">0.0</span>M', LABEL.x - 84, LABEL.y - 70, 'right');
      const m5 = lab('5%', POOL.x + 22, POOL.y + POOL.r + 38, 'left', 'sm pill');
      const m07 = lab('$<span class="hf-num">0.0</span>M', ART.x + 50, ART.y - 64, 'left');

      // coins raining from the crowd
      const coins = [];
      for (let i = 0; i < 14; i++) { const c = HF.g(fx); HF.coin(c, { r: 9 }); gsap.set(c, { x: -100, y: -100 }); coins.push(c); }

      // ================================================================ choreography
      // 0.0–1.0 listeners and coins
      crowd.forEach((ch, i) => {
        HF.pop(tl, ch.g, 0.02 + i * 0.03, { origin: '50% 100%' });
        tl.fromTo(ch.inner, { y: 0 }, { y: -7, duration: 0.25, ease: 'sine.inOut', yoyo: true, repeat: 19, immediateRender: false }, 0.3 + (i % 3) * 0.08);
      });
      HF.pop(tl, trough, 0.15, { origin: '50% 50%' });
      coins.forEach((c, i) => {
        const at = 0.25 + i * 0.045;
        const x = 360 + ((i * 47) % 560);
        HF.arc(tl, c, { x0: x, y0: 112, x1: x + 18, y1: CH.y - 4 }, at, 0.38, { fall: 'power2.in', spin: 180 });
        tl.to(c, { scale: 0, duration: 0.08, transformOrigin: '50% 50%' }, at + 0.37);
      });
      tl.to(flow, { scaleX: 1, duration: 0.65, ease: 'power1.out' }, 0.32);
      HF.pop(tl, m100.l, 0.55, { origin: '100% 50%' });
      HF.count(m100.n, 0, 100, 0.55, 0.45);

      // 1.0–2.0 the fork: 30% to the streaming service, $70M to the pool
      tl.to(branch.bed, { opacity: 1, duration: 0.15 }, 1.0);
      tl.to(branch.p, { strokeDashoffset: 0, duration: 0.5, ease: 'power1.inOut' }, 1.02);
      HF.pop(tl, spot, 1.2, { origin: '50% 100%' });
      HF.pop(tl, m30.l, 1.3, { origin: '0% 50%' });
      tl.to(toPool.bed, { opacity: 1, duration: 0.15 }, 1.3);
      tl.to(toPool.p, { strokeDashoffset: 0, duration: 0.3, ease: 'power1.in' }, 1.32);
      tl.to(slices.map((k) => k.s), { scale: 1, duration: 0.35, ease: 'back.out(1.4)', stagger: 0.015 }, 1.55);
      HF.pop(tl, m70.l, 1.65, { origin: '100% 50%' });
      HF.count(m70.n, 100, 70, 1.7, 0.4);

      // 2.0–3.6 the 5% slice lifts out and flows down to the record label
      const five = slices[0];
      const out = 22, mx = Math.cos((five.mid * Math.PI) / 180) * out, my = Math.sin((five.mid * Math.PI) / 180) * out;
      tl.to(five.s, { x: mx, y: my, scale: 1.12, duration: 0.35, ease: 'back.out(1.6)' }, 2.05);
      HF.pop(tl, m5.l, 2.15, { origin: '0% 50%' });
      HF.pop(tl, label, 2.2, { origin: '50% 100%' });
      tl.to(toLabel.bed, { opacity: 1, duration: 0.15 }, 2.35);
      tl.to(toLabel.p, { strokeDashoffset: 0, duration: 0.6, ease: 'power1.in' }, 2.45);
      tl.to(five.s, { y: LABEL.y - 66 - POOL.y, scale: 0.35, opacity: 0, duration: 0.65, ease: 'power2.in' }, 2.5);
      HF.land(tl, label, 3.1, { amount: 0.08 });
      HF.pop(tl, m35.l, 3.1, { origin: '100% 50%' });
      HF.count(m35.n, 0, 3.5, 3.1, 0.45, { format: (v) => v.toFixed(1) });

      // 3.6–5.0 a thin trickle through the 20% gate to the artist
      HF.pop(tl, gate, 3.6, { origin: '50% 100%' });
      HF.pop(tl, artist.g, 3.7, { origin: '50% 100%' });
      tl.to(trickle.bed, { opacity: 1, duration: 0.15 }, 3.8);
      tl.to(trickle.p, { strokeDashoffset: 0, duration: 0.9, ease: 'power1.inOut' }, 3.85);
      HF.pop(tl, m07.l, 4.5, { origin: '0% 50%' });
      HF.count(m07.n, 0, 0.7, 4.5, 0.4, { format: (v) => v.toFixed(1) });
      tl.to(artist.eyes, { x: -6, y: 3, duration: 0.25, ease: 'sine.inOut' }, 4.3);
      tl.to(artist.eyes, { keyframes: { scaleY: [1, 0.1, 1] }, transformOrigin: '50% 50%', duration: 0.18, ease: 'none' }, 4.75);
      tl.to(artist.eyes, { keyframes: { scaleY: [1, 0.1, 1] }, transformOrigin: '50% 50%', duration: 0.18, ease: 'none' }, 5.15);

      // camera: follow the money down, then ease out to show the whole funnel
      tl.set(HF.world().world, { scale: 1.06, y: 90 }, 0);
      HF.camera(tl, { y: 30 }, 1.0, 1.2);
      HF.camera(tl, { y: -50 }, 2.4, 1.4);
      HF.camera(tl, { scale: 0.96, y: 0 }, 5.0, 0.8);
    })();
  </script>
  <script type="module" src="../../kit/kit-three.js"></script>
</body>
</html>

examples:
  - id: price-china-tesla
    source: 'BYD case, Exhibit 4 (price in China): BYD Seal 26,572 and Tesla Model 3 32,466'
    fn: compare
    in: { base: 26572, other: 32466 }
    expect: { diff: 5894, pctUnder: 0.1815 }
    tol: 0.001
  - id: price-germany-tesla
    source: 'BYD case, Exhibit 4 (price in Germany): BYD Seal 45,060 and Tesla Model 3 45,769'
    fn: compare
    in: { base: 45060, other: 45769 }
    expect: { diff: 709, pctUnder: 0.0155 }
    tol: 0.001
  - id: price-seal-markup
    source: 'BYD case, Exhibit 4: Seal costs 26,572 in China and 45,060 in Germany'
    fn: compare
    in: { base: 26572, other: 45060 }
    expect: { diff: 18488, pctOver: 0.6958 }
    tol: 0.001
  - id: battery-renault
    source: 'BYD case, Exhibit 4: battery cost per kWh, BYD 128 and Renault 175'
    fn: compare
    in: { base: 128, other: 175 }
    expect: { pctOver: 0.3672 }
    tol: 0.001
  - id: battery-vw
    source: 'BYD case, Exhibit 4: battery cost per kWh, BYD 128 and VW 169'
    fn: compare
    in: { base: 128, other: 169 }
    expect: { diff: 41, pctOver: 0.3203 }
    tol: 0.001
  - id: powertrain-vw
    source: 'BYD case, Exhibit 4: powertrain, BYD 1,979 and VW 2,970'
    fn: compare
    in: { base: 1979, other: 2970 }
    expect: { diff: 991, pctOver: 0.5008 }
    tol: 0.001
  - id: capex-korean
    source: 'BYD case, page 4: capital cost per GWh, CATL 60 and Korean peers 88'
    fn: compare
    in: { base: 60, other: 88 }
    expect: { diff: 28, pctOver: 0.4667 }
    tol: 0.001
  - id: capex-japanese
    source: 'BYD case, page 4: capital cost per GWh, CATL 60 and Japanese rivals 103'
    fn: compare
    in: { base: 60, other: 103 }
    expect: { diff: 43, pctOver: 0.7167 }
    tol: 0.001
  - id: wages
    source: 'BYD case, page 9: Shenzhen workers 750 and Tesla Shanghai workers 1,000'
    fn: compare
    in: { base: 750, other: 1000 }
    expect: { diff: 250, pctUnder: 0.25 }
    tol: 0.001
  - id: dev-time
    source: 'BYD case, page 5: Volkswagen 4 years and Chinese makers 2.5 years'
    fn: compare
    in: { base: 2.5, other: 4 }
    expect: { diff: 1.5, pctUnder: 0.375, pctOver: 0.6 }
    tol: 0.001
  - id: model-life
    source: 'BYD case, page 6: Chinese EVs 1.2 years and foreign brands 4.2 years on the market'
    fn: compare
    in: { base: 1.2, other: 4.2 }
    expect: { ratio: 3.5 }
    tol: 0.001
  - id: model-releases
    source: 'BYD case, page 6: Tesla 5 model releases and BYD 40 (2017 to 2026)'
    fn: compare
    in: { base: 5, other: 40 }
    expect: { ratio: 8 }
    tol: 0.001
  - id: byd-growth
    source: 'BYD case, page 8: 741,000 cars in 2021 and more than 4.6 million in 2025'
    fn: growthRate
    in: { start: 741000, end: 4600000, years: 4 }
    expect: { multiple: 6.2078, cagr: 0.5785 }
    tol: 0.001
  - id: breakeven-multiple
    source: 'BYD case, pages 5 and 8: break-even 400,000 cars and BYD volume 4.6 million'
    fn: compare
    in: { base: 400000, other: 4600000 }
    expect: { ratio: 11.5 }
    tol: 0.001
  - id: overseas-target
    source: 'BYD case, pages 10: exports of 1.05 million of 4.6 million and the 50% target for 2030'
    fn: overseasGap
    in: { total: 4600000, overseas: 1050000, targetShare: 0.5 }
    expect: { share: 0.2283, needed: 2300000, extra: 1250000 }
    tol: 0.001
  - id: tariff-us
    source: 'BYD case, page 1: US tariffs of 100% or more on the Seal at its China price'
    fn: tariffedPrice
    in: { price: 26572, tariff: 1 }
    expect: { duty: 26572, total: 53144, multiple: 2 }
    tol: 0.5
  - id: subsidy-part
    source: 'BYD case, page 9: 4,700 per vehicle advantage over Tesla, of which 5% was subsidies'
    fn: subsidyShare
    in: { advantage: 4700, share: 0.05 }
    expect: { part: 235, rest: 4465 }
    tol: 0.5
